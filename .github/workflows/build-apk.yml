name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Files & Initialize Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp "index.html" www/index.html
          elif [ -f "mymoney-pro.html" ]; then
            cp "mymoney-pro.html" www/index.html
          else
            HTML_FILE=$(find . -maxdepth 2 -name "*.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              echo "ERROR: No .html file found in your repository! Please upload index.html to the repository."
              exit 1
            fi
          fi
          if [ -f "manifest.json" ]; then cp "manifest.json" www/; fi
          if [ -f "sw.js" ]; then cp "sw.js" www/; fi

          cat << 'EOF' > package.json
          {
            "name": "mymoney-pro-app",
            "version": "2.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MyMoney Pro" "com.mymoney.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMoney-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
