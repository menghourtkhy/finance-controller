<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <title>MyMoney Pro v3.0</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-alt: #1c2640;
      --border: #263354;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --green: #10b981;
      --red: #f43f5e;
      --amber: #f59e0b;
      --cyan: #06b6d4;
    }
    body.light {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }
    header {
      position: sticky; top: 0; z-index: 30;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff;
    }
    .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    input, select, button {
      font-family: inherit; font-size: 13px;
      color: var(--text); background: var(--card-alt);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; outline: none;
    }
    button { cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-red { background: rgba(244,63,94,0.18); border-color: var(--red); color: var(--red); }
    .container { max-width: 980px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px;
    }
    .kpi-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .kpi-val { font-size: 19px; font-weight: 800; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-amber { color: var(--amber); }
    .text-muted { color: var(--muted); font-size: 12px; }
    .progress-track { width: 100%; height: 9px; background: var(--card-alt); border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.25s; }
    .row-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .row-item:last-child { border-bottom: none; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px;
      font-size: 10px; font-weight: 700; background: var(--card-alt); color: var(--muted);
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--card); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(6, 1fr); padding: 4px 2px;
    }
    .nav-btn {
      background: transparent; border: none; padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--muted); border-radius: 8px;
    }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .fab {
      position: fixed; right: 16px; bottom: 72px; z-index: 45;
      width: 54px; height: 54px; border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; font-size: 26px; font-weight: 700;
      border: none; box-shadow: 0 8px 24px rgba(99,102,241,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,0.75);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--card); border: 1px solid var(--border);
      width: 100%; max-width: 560px; max-height: 90vh;
      border-radius: 20px 20px 0 0; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip { white-space: nowrap; font-size: 12px; padding: 6px 10px; border-radius: 99px; background: var(--card-alt); }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <div style="font-weight:800; font-size:15px;">MyMoney Pro <span class="badge" style="color:#10b981;">v3.0</span></div>
        <div class="text-muted" id="header-sub">● Reconciled • Offline Ready</div>
      </div>
    </div>
    <div class="controls">
      <input type="month" id="ctrl-month" onchange="App.setMonth(this.value)" />
      <select id="ctrl-curr" onchange="App.setCurrency(this.value)">
        <option value="USD">USD ($)</option>
        <option value="KHR">KHR (៛)</option>
      </select>
      <button onclick="App.toggleTheme()" id="btn-theme">☀️</button>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="container" id="main-view"></main>

  <!-- FLOATING QUICK ADD BUTTON -->
  <button class="fab" onclick="App.openTxModal()" title="Add Transaction">+</button>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal" onclick="if(event.target===this)App.closeModal()">
    <div class="modal-box" id="modal-body"></div>
  </div>

<script>
// Clear any stuck old service workers immediately
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
}

const STORAGE_KEY = 'mymoney_pro_v3_state';

const CATEGORIES = [
  { id: 'cat_salary', name: 'Salary & Payroll', type: 'income', icon: '💼', color: '#10b981' },
  { id: 'cat_bonus', name: 'Side Income / Bonus', type: 'income', icon: '🚀', color: '#34d399' },
  { id: 'cat_food', name: 'Food & Dining', type: 'expense', icon: '🍜', color: '#f59e0b' },
  { id: 'cat_groceries', name: 'Groceries & Market', type: 'expense', icon: '🛒', color: '#84cc16' },
  { id: 'cat_housing', name: 'Rent & Housing', type: 'expense', icon: '🏠', color: '#6366f1' },
  { id: 'cat_utilities', name: 'EDC, PPWSA & Internet', type: 'expense', icon: '⚡', color: '#06b6d4' },
  { id: 'cat_transport', name: 'Fuel, Grab & Transport', type: 'expense', icon: '🛵', color: '#ec4899' },
  { id: 'cat_shopping', name: 'Shopping & Household', type: 'expense', icon: '🛍️', color: '#8b5cf6' },
  { id: 'cat_health', name: 'Health & Pharmacy', type: 'expense', icon: '🏥', color: '#ef4444' },
  { id: 'cat_edu', name: 'Courses & Subscriptions', type: 'expense', icon: '🎓', color: '#3b82f6' },
  { id: 'cat_adjust', name: 'Balance Adjustment', type: 'both', icon: '⚖️', color: '#64748b' }
];

const TABS = [
  { id: 'dashboard', label: 'Home', icon: '📊' },
  { id: 'transactions', label: 'Ledger', icon: '🧾' },
  { id: 'budgets', label: 'Budget', icon: '🎯' },
  { id: 'accounts', label: 'Accounts', icon: '🏦' },
  { id: 'goals', label: 'Goals', icon: '🏆' },
  { id: 'more', label: 'More', icon: '⚙️' }
];

const App = {
  state: null,
  tab: 'dashboard',
  filter: { q: '', type: 'ALL', acc: 'ALL' },

  defaultState() {
    const m = new Date().toISOString().slice(0, 7);
    return {
      month: m,
      currency: 'USD',
      fxRate: 4050,
      theme: 'dark',
      accounts: [
        { id: 'acc_aba', name: 'ABA Bank (USD)', type: 'bank', currency: 'USD', opening: 1850, isDebt: false },
        { id: 'acc_khr', name: 'Bakong / KHQR (KHR)', type: 'ewallet', currency: 'KHR', opening: 1620000, isDebt: false },
        { id: 'acc_cash', name: 'Wallet Cash (USD)', type: 'cash', currency: 'USD', opening: 150, isDebt: false },
        { id: 'acc_save', name: 'Savings Account (USD)', type: 'savings', currency: 'USD', opening: 3200, isDebt: false },
        { id: 'acc_cc', name: 'Visa Credit Card', type: 'credit', currency: 'USD', opening: -240, isDebt: true }
      ],
      transactions: [
        { id: 't1', date: m + '-01', type: 'income', desc: 'Monthly Salary', amount: 1650, currency: 'USD', fx: 4050, accountId: 'acc_aba', categoryId: 'cat_salary', notes: 'Payroll' },
        { id: 't2', date: m + '-03', type: 'income', desc: 'Consulting & Automation Project', amount: 250, currency: 'USD', fx: 4050, accountId: 'acc_aba', categoryId: 'cat_bonus', notes: '' },
        { id: 't3', date: m + '-05', type: 'expense', desc: 'Apartment Rent', amount: 350, currency: 'USD', fx: 4050, accountId: 'acc_aba', categoryId: 'cat_housing', notes: '' },
        { id: 't4', date: m + '-07', type: 'expense', desc: 'Aeon Supermarket Groceries', amount: 96, currency: 'USD', fx: 4050, accountId: 'acc_cc', categoryId: 'cat_groceries', notes: '' },
        { id: 't5', date: m + '-09', type: 'expense', desc: 'Lunches & Coffee (KHQR)', amount: 460000, currency: 'KHR', fx: 4050, accountId: 'acc_khr', categoryId: 'cat_food', notes: '' },
        { id: 't6', date: m + '-11', type: 'expense', desc: 'EDC Electricity & PPWSA Water', amount: 215000, currency: 'KHR', fx: 4050, accountId: 'acc_khr', categoryId: 'cat_utilities', notes: '' },
        { id: 't7', date: m + '-12', type: 'expense', desc: 'Online Course Bundle', amount: 40, currency: 'USD', fx: 4050, accountId: 'acc_cc', categoryId: 'cat_edu', notes: '' },
        { id: 't8', date: m + '-13', type: 'refund', desc: 'Course Discount Refund', amount: 10, currency: 'USD', fx: 4050, accountId: 'acc_cc', categoryId: 'cat_edu', notes: 'Offsets education expense' },
        { id: 't9', date: m + '-14', type: 'transfer', desc: 'Emergency Fund Transfer', amount: 300, currency: 'USD', fx: 4050, accountId: 'acc_aba', toAccountId: 'acc_save', categoryId: 'cat_adjust', notes: 'Internal transfer' },
        { id: 't10', date: m + '-15', type: 'transfer', desc: 'Credit Card Bill Paydown', amount: 150, currency: 'USD', fx: 4050, accountId: 'acc_aba', toAccountId: 'acc_cc', categoryId: 'cat_adjust', notes: 'Liability payment' }
      ],
      budgets: {
        [m]: {
          overallUSD: 1100,
          rollover: false,
          cats: { cat_housing: 350, cat_food: 180, cat_groceries: 150, cat_utilities: 90, cat_transport: 80, cat_shopping: 100, cat_health: 50, cat_edu: 60 }
        }
      },
      goals: [
        { id: 'g1', name: '6-Month Emergency Fund', target: 6000, current: 3500, monthly: 300, date: '2027-06-30' },
        { id: 'g2', name: 'New Workstation Fund', target: 1500, current: 550, monthly: 150, date: '2027-03-31' }
      ],
      recurring: [
        { id: 'r1', desc: 'Monthly Salary', type: 'income', amount: 1650, currency: 'USD', day: 28, accountId: 'acc_aba', categoryId: 'cat_salary', lastPosted: '' },
        { id: 'r2', desc: 'Apartment Rent', type: 'expense', amount: 350, currency: 'USD', day: 5, accountId: 'acc_aba', categoryId: 'cat_housing', lastPosted: m },
        { id: 'r3', desc: 'EDC Electricity Bill', type: 'expense', amount: 185000, currency: 'KHR', day: 12, accountId: 'acc_khr', categoryId: 'cat_utilities', lastPosted: '' },
        { id: 'r4', desc: 'PPWSA Water Bill', type: 'expense', amount: 28000, currency: 'KHR', day: 14, accountId: 'acc_khr', categoryId: 'cat_utilities', lastPosted: '' }
      ]
    };
  },

  init() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : this.defaultState();
      if (!this.state || !Array.isArray(this.state.accounts)) this.state = this.defaultState();
    } catch (e) {
      this.state = this.defaultState();
    }
    document.getElementById('ctrl-month').value = this.state.month;
    document.getElementById('ctrl-curr').value = this.state.currency;
    document.body.classList.toggle('light', this.state.theme === 'light');
    this.renderNav();
    this.render();
  },

  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
  },

  conv(amt, from, to, rate) {
    const n = Number(amt) || 0;
    if (from === to) return n;
    const fx = Number(rate) || this.state.fxRate || 4050;
    return from === 'USD' ? Math.round(n * fx) : +(n / fx).toFixed(2);
  },

  fmt(amt, curr = this.state.currency) {
    const n = Number(amt) || 0;
    if (curr === 'KHR') return Math.round(n).toLocaleString('en-US') + ' ៛';
    return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  getAccBalance(accId) {
    const acc = this.state.accounts.find(a => a.id === accId);
    if (!acc) return 0;
    let bal = Number(acc.opening) || 0;
    this.state.transactions.forEach(t => {
      const fx = t.fx || this.state.fxRate;
      if (t.accountId === accId) {
        const v = this.conv(t.amount, t.currency, acc.currency, fx);
        if (t.type === 'income' || t.type === 'refund') bal += v;
        else bal -= v;
      }
      if (t.type === 'transfer' && t.toAccountId === accId) {
        bal += this.conv(t.amount, t.currency, acc.currency, fx);
      }
    });
    return acc.currency === 'KHR' ? Math.round(bal) : +bal.toFixed(2);
  },

  getMetrics(month = this.state.month) {
    const curr = this.state.currency;
    let income = 0, grossExp = 0, refunds = 0, transfers = 0;
    const byCat = {};
    this.state.transactions.filter(t => t.date.startsWith(month)).forEach(t => {
      const v = this.conv(t.amount, t.currency, curr, t.fx);
      if (t.type === 'transfer') { transfers += v; return; }
      if (t.type === 'income') { income += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
      else if (t.type === 'expense') { grossExp += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
      else if (t.type === 'refund') { refunds += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) - v; }
    });
    const netExp = Math.max(0, grossExp - refunds);
    let assets = 0, debt = 0;
    this.state.accounts.forEach(a => {
      const b = this.conv(this.getAccBalance(a.id), a.currency, curr, this.state.fxRate);
      if (a.isDebt || b < 0) debt += Math.abs(b);
      else assets += b;
    });
    return { income, netExp, refunds, netFlow: income - netExp, transfers, byCat, assets, debt, netWorth: assets - debt };
  },

  setMonth(m) { if (m) { this.state.month = m; this.save(); this.render(); } },
  setCurrency(c) { this.state.currency = c; this.save(); this.render(); },
  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', this.state.theme === 'light');
    this.save();
  },

  switchTab(t) {
    this.tab = t;
    this.renderNav();
    this.render();
    window.scrollTo(0, 0);
  },

  renderNav() {
    document.getElementById('bottom-nav').innerHTML = TABS.map(t => `
      <button class="nav-btn ${this.tab === t.id ? 'active' : ''}" onclick="App.switchTab('${t.id}')">
        <span style="font-size:17px;">${t.icon}</span>
        <span>${t.label}</span>
      </button>
    `).join('');
  },

  render() {
    const el = document.getElementById('main-view');
    if (this.tab === 'dashboard') this.renderDashboard(el);
    else if (this.tab === 'transactions') this.renderTransactions(el);
    else if (this.tab === 'budgets') this.renderBudgets(el);
    else if (this.tab === 'accounts') this.renderAccounts(el);
    else if (this.tab === 'goals') this.renderGoals(el);
    else this.renderMore(el);
  },

  renderDashboard(el) {
    const m = this.state.month;
    const curr = this.state.currency;
    const k = this.getMetrics(m);
    const bObj = this.state.budgets[m] || { overallUSD: 1100, cats: {} };
    const budgetTotal = this.conv(bObj.overallUSD || 1100, 'USD', curr, this.state.fxRate);
    const budgetPct = budgetTotal > 0 ? Math.min(100, (k.netExp / budgetTotal) * 100) : 0;

    const expCats = CATEGORIES.filter(c => c.type === 'expense')
      .map(c => ({ ...c, val: Math.max(0, k.byCat[c.id] || 0) }))
      .filter(c => c.val > 0)
      .sort((a, b) => b.val - a.val);

    el.innerHTML = `
      <!-- Quick Strip -->
      <div class="chips">
        <span class="chip">💱 1 USD = ${this.state.fxRate.toLocaleString()} KHR</span>
        <button class="chip" onclick="App.openFxModal()">Edit FX Rate</button>
        <button class="chip" onclick="App.openTxModal('transfer')">⇄ Transfer / Pay Card</button>
        <button class="chip" onclick="App.switchTab('more')">📅 Bills & Backup</button>
      </div>

      <!-- 4 KPI Cards -->
      <div class="grid-2">
        <div class="card" onclick="App.switchTab('transactions')">
          <div class="kpi-title"><span>INCOME (${m})</span><span class="text-green">↑ IN</span></div>
          <div class="kpi-val text-green">${this.fmt(k.income)}</div>
          <div class="text-muted">Excludes transfers</div>
        </div>
        <div class="card" onclick="App.switchTab('transactions')">
          <div class="kpi-title"><span>NET EXPENSES</span><span class="text-red">↓ OUT</span></div>
          <div class="kpi-val text-red">${this.fmt(k.netExp)}</div>
          <div class="text-muted">${k.refunds > 0 ? 'After ' + this.fmt(k.refunds) + ' refunds' : 'Tap for ledger'}</div>
        </div>
        <div class="card">
          <div class="kpi-title"><span>NET CASH FLOW</span><span>💧</span></div>
          <div class="kpi-val ${k.netFlow >= 0 ? 'text-green' : 'text-red'}">${k.netFlow >= 0 ? '+' : ''}${this.fmt(k.netFlow)}</div>
          <div class="text-muted">Income minus net spend</div>
        </div>
        <div class="card" onclick="App.switchTab('accounts')">
          <div class="kpi-title"><span>NET WORTH</span><span>🏦</span></div>
          <div class="kpi-val">${this.fmt(k.netWorth)}</div>
          <div class="text-muted">Assets: ${this.fmt(k.assets)}</div>
        </div>
      </div>

      <!-- Master Monthly Budget Bar -->
      <div class="card" onclick="App.switchTab('budgets')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:700; font-size:14px;">Monthly Budget Usage (${m})</div>
            <div class="text-muted">${this.fmt(k.netExp)} spent of ${this.fmt(budgetTotal)} (${budgetPct.toFixed(1)}%)</div>
          </div>
          <span class="badge" style="color:${budgetPct > 90 ? 'var(--red)' : 'var(--green)'}">
            ${this.fmt(budgetTotal - k.netExp)} left
          </span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${budgetPct}%; background:${budgetPct > 90 ? 'var(--red)' : budgetPct > 75 ? 'var(--amber)' : 'var(--green)'};"></div>
        </div>
      </div>

      <!-- Native Category Breakdown Bars -->
      <div class="card">
        <div style="font-weight:700; font-size:14px; margin-bottom:8px;">Spending Breakdown (${m})</div>
        ${expCats.length ? expCats.map(c => {
          const pct = k.netExp > 0 ? (c.val / k.netExp) * 100 : 0;
          return `
            <div style="margin-bottom:10px;">
              <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px;">
                <span>${c.icon}${c.name}</span>
                <strong>${this.fmt(c.val)} (${pct.toFixed(0)}%)</strong>
              </div>
              <div class="progress-track" style="height:6px; margin:0;">
                <div class="progress-fill" style="width:${pct}\%; background:${c.color};"></div>
              </div>
            </div>
          `;
        }).join('') : '<div class="text-muted">No expenses recorded for this month yet. Tap + to add one.</div>'}
      </div>

      <!-- Accounts Overview -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-weight:700; font-size:14px;">Account Balances</span>
          <span class="text-muted" onclick="App.switchTab('accounts')">Manage →</span>
        </div>
        ${this.state.accounts.map(a => {
          const bal = this.getAccBalance(a.id);
          return `
            <div class="row-item">
              <div>
                <div style="font-weight:600; font-size:13px;">${a.name}</div>
                <div class="text-muted">${a.type.toUpperCase()} •${a.currency}</div>
              </div>
              <div style="text-align:right; font-weight:700;" class="${bal < 0 ? 'text-red' : 'text-green'}">
                ${this.fmt(bal, a.currency)}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Recent Transactions -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-weight:700; font-size:14px;">Recent Transactions</span>
          <span class="text-muted" onclick="App.switchTab('transactions')">See All →</span>
        </div>
        ${this.renderTxRows(this.state.transactions.filter(t => t.date.startsWith(m)).slice().reverse().slice(0, 6))}
      </div>
    `;
  },

  renderTxRows(list) {
    if (!list.length) return '<div class="text-muted" style="padding:12px 0;">No transactions found.</div>';
    return list.map(t => {
      const cat = CATEGORIES.find(c => c.id === t.categoryId) || { icon: '🔄', name: 'Transfer' };
      const acc = this.state.accounts.find(a => a.id === t.accountId);
      const cls = t.type === 'income' || t.type === 'refund' ? 'text-green' : t.type === 'transfer' ? '' : 'text-red';
      const sign = t.type === 'income' || t.type === 'refund' ? '+' : t.type === 'transfer' ? '⇄ ' : '-';
      return `
        <div class="row-item" onclick="App.editTx('${t.id}')">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:20px;">${t.type === 'transfer' ? '🔄' : cat.icon}</div>
            <div>
              <div style="font-weight:600; font-size:13px;">${t.desc} ${t.type === 'refund' ? '<span class="badge">Refund</span>' : ''}</div>
              <div class="text-muted">${t.date} • ${acc ? acc.name : ''} • ${cat.name}</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; font-size:13px;" class="${cls}">${sign}${this.fmt(t.amount, t.currency)}</div>
            <div class="text-muted">Tap to edit</div>
          </div>
        </div>
      `;
    }).join('');
  },

  renderTransactions(el) {
    const list = this.state.transactions.filter(t => {
      if (this.filter.q && !t.desc.toLowerCase().includes(this.filter.q.toLowerCase())) return false;
      if (this.filter.type !== 'ALL' && t.type !== this.filter.type) return false;
      if (this.filter.acc !== 'ALL' && t.accountId !== this.filter.acc) return false;
      return true;
    }).slice().sort((a, b) => b.date.localeCompare(a.date));

    el.innerHTML = `
      <div class="card">
        <div style="font-weight:700; font-size:15px; margin-bottom:10px;">Transaction Ledger (${list.length})</div>
        <div class="grid-3">
          <input placeholder="Search description..." value="${this.filter.q}" oninput="App.filter.q=this.value; App.render()" />
          <select onchange="App.filter.type=this.value; App.render()">
            <option value="ALL">All Types</option>
            <option value="expense" ${this.filter.type==='expense'?'selected':''}>Expenses</option>
            <option value="income" ${this.filter.type==='income'?'selected':''}>Income</option>
            <option value="refund" ${this.filter.type==='refund'?'selected':''}>Refunds</option>
            <option value="transfer" ${this.filter.type==='transfer'?'selected':''}>Transfers</option>
          </select>
          <select onchange="App.filter.acc=this.value; App.render()">
            <option value="ALL">All Accounts</option>
            ${this.state.accounts.map(a => `<option value="${a.id}" ${this.filter.acc===a.id?'selected':''}>${a.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="card">${this.renderTxRows(list)}</div>
    `;
  },

  renderBudgets(el) {
    const m = this.state.month;
    const curr = this.state.currency;
    if (!this.state.budgets[m]) {
      this.state.budgets[m] = { overallUSD: 1100, cats: { cat_housing: 350, cat_food: 180, cat_groceries: 150, cat_utilities: 90, cat_transport: 80, cat_shopping: 100 } };
    }
    const b = this.state.budgets[m];
    const k = this.getMetrics(m);

    el.innerHTML = `
      <div class="card">
        <div style="font-weight:700; font-size:15px;">Monthly Budget Planner (${m})</div>
        <div class="text-muted" style="margin-bottom:10px;">Changing ${m} budgets never overwrites previous months.</div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span>Master Monthly Limit (USD):</span>
          <input type="number" value="${b.overallUSD}" style="width:110px; font-weight:700;"
            onchange="App.state.budgets['${m}'].overallUSD=Number(this.value)||0; App.save(); App.render()" />
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700; font-size:14px; margin-bottom:10px;">Category Budgets (${m})</div>
        ${CATEGORIES.filter(c => c.type === 'expense').map(cat => {
          const limitUSD = Number(b.cats[cat.id] || 0);
          const limitCurr = this.conv(limitUSD, 'USD', curr, this.state.fxRate);
          const spent = Math.max(0, k.byCat[cat.id] || 0);
          const pct = limitCurr > 0 ? Math.min(100, (spent / limitCurr) * 100) : 0;
          return `
            <div style="padding:10px 0; border-bottom:1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:600; font-size:13px;">${cat.icon}${cat.name}</span>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span class="text-muted">USD</span>
                  <input type="number" value="${limitUSD}" style="width:85px;"
                    onchange="App.state.budgets['${m}'].cats['${cat.id}']=Number(this.value)||0; App.save(); App.render()" />
                </div>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${pct}\%; background:${pct > 95 ? 'var(--red)' : pct > 75 ? 'var(--amber)' : 'var(--green)'};"></div>
              </div>
              <div class="text-muted" style="display:flex; justify-content:space-between;">
                <span>Spent: ${this.fmt(spent)} of${this.fmt(limitCurr)}</span>
                <span>${pct.toFixed(0)}%</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },

  renderAccounts(el) {
    const k = this.getMetrics();
    el.innerHTML = `
      <div class="grid-3">
        <div class="card"><div class="kpi-title">TOTAL ASSETS</div><div class="kpi-val text-green">${this.fmt(k.assets)}</div></div>
        <div class="card"><div class="kpi-title">TOTAL LIABILITIES</div><div class="kpi-val text-red">${this.fmt(k.debt)}</div></div>
        <div class="card"><div class="kpi-title">NET WORTH</div><div class="kpi-val">${this.fmt(k.netWorth)}</div></div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-weight:700; font-size:15px;">Accounts & Cards</span>
          <button class="btn-primary" onclick="App.openNewAccountModal()">+ Add Account</button>
        </div>
        ${this.state.accounts.map(a => {
          const bal = this.getAccBalance(a.id);
          return `
            <div class="row-item">
              <div>
                <div style="font-weight:700;">${a.name}</div>
                <div class="text-muted">${a.type.toUpperCase()} •${a.currency}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <strong class="${bal < 0 ? 'text-red' : 'text-green'}">${this.fmt(bal, a.currency)}</strong>
                <button onclick="App.reconcileAccount('${a.id}')">⚖️ Reconcile</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },

  renderGoals(el) {
    el.innerHTML = `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700; font-size:15px;">Savings & Emergency Goals</div>
          <div class="text-muted">Track milestones without double-counting expenses</div>
        </div>
        <button class="btn-primary" onclick="App.addGoalPrompt()">+ New Goal</button>
      </div>
      ${this.state.goals.map(g => {
        const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0;
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <strong>🎯 ${g.name}</strong>
              <span class="text-green" style="font-weight:700;">${this.fmt(g.current, 'USD')} /${this.fmt(g.target, 'USD')}</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:var(--primary);"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <span class="text-muted">${pct.toFixed(1)}\% complete • Target: ${g.date}</span>
              <div style="display:flex; gap:6px;">
                <button class="btn-green" onclick="App.updateGoal('${g.id}', 100)">+$100</button>
                <button onclick="App.updateGoal('${g.id}', -100)">-$100</button>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    `;
  },

  renderMore(el) {
    const m = this.state.month;
    const k = this.getMetrics(m);
    el.innerHTML = `
      <!-- Recurring Bills -->
      <div class="card">
        <div style="font-weight:700; font-size:15px; margin-bottom:8px;">📅 Scheduled Recurring Bills (${m})</div>
        ${this.state.recurring.map(r => {
          const posted = r.lastPosted === m;
          return `
            <div class="row-item">
              <div>
                <div style="font-weight:600;">${r.desc}</div>
                <div class="text-muted">Day ${r.day} •${this.fmt(r.amount, r.currency)}</div>
              </div>
              ${posted ? '<span class="badge" style="color:var(--green);">Posted ✓</span>' : `<button class="btn-primary" onclick="App.postRecurring('${r.id}')">Post Now</button>`}
            </div>
          `;
        }).join('')}
      </div>

      <!-- Smart Insights -->
      <div class="card">
        <div style="font-weight:700; font-size:15px; margin-bottom:8px;">💡 Rule-Based Financial Insights</div>
        <div class="text-muted" style="line-height:1.5;">
          • <strong>Savings Rate:</strong> ${k.income > 0 ? (((k.income - k.netExp) / k.income) * 100).toFixed(1) : 0}% of income retained in ${m}.<br/>
          • <strong>Internal Transfers Excluded:</strong> ${this.fmt(k.transfers)} moved between accounts without distorting expenses.<br/>
          • <strong>Active Exchange Rate:</strong> 1 USD = ${this.state.fxRate.toLocaleString()} KHR.
        </div>
      </div>

      <!-- Backup & Restore -->
      <div class="card">
        <div style="font-weight:700; font-size:15px; margin-bottom:8px;">💾 Full JSON Backup & Restore</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
          <button class="btn-primary" onclick="App.downloadBackup()">⬇️ Download JSON Backup</button>
          <button class="btn-red" onclick="if(confirm('Reset to clean demo data?')){localStorage.removeItem('${STORAGE_KEY}');location.reload();}">Reset Demo Data</button>
        </div>
        <div class="text-muted" style="margin-bottom:4px;">Restore from JSON Backup file:</div>
        <input type="file" accept=".json" onchange="App.restoreBackup(event)" />
      </div>
    `;
  },

  openTxModal(defaultType = 'expense') {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('modal-body').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:16px;">Add Transaction</strong>
        <button onclick="App.closeModal()">✕</button>
      </div>
      <div class="grid-2">
        <select id="m-type" onchange="document.getElementById('m-to-wrap').style.display=this.value==='transfer'?'block':'none'">
          <option value="expense" ${defaultType==='expense'?'selected':''}>Expense</option>
          <option value="income" ${defaultType==='income'?'selected':''}>Income</option>
          <option value="refund" ${defaultType==='refund'?'selected':''}>Refund (Offsets Expense)</option>
          <option value="transfer" ${defaultType==='transfer'?'selected':''}>Transfer / Pay Credit Card</option>
        </select>
        <input type="date" id="m-date" value="${today}" />
      </div>
      <div class="grid-2">
        <input type="number" step="any" id="m-amt" placeholder="Amount (e.g. 25.00)" />
        <select id="m-curr">
          <option value="USD">USD ($)</option>
          <option value="KHR">KHR (៛)</option>
        </select>
      </div>
      <input type="text" id="m-desc" placeholder="Description (e.g. Coffee, EDC Bill, Salary)" />
      <div class="grid-2">
        <div>
          <div class="text-muted">Account</div>
          <select id="m-acc" style="width:100%;">
            ${this.state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
        <div>
          <div class="text-muted">Category</div>
          <select id="m-cat" style="width:100%;">
            ${CATEGORIES.map(c => `<option value="${c.id}">${c.icon}${c.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="m-to-wrap" style="display:${defaultType==='transfer'?'block':'none'};">
        <div class="text-muted">Transfer To Destination Account</div>
        <select id="m-to-acc" style="width:100%;">
          ${this.state.accounts.map((a, i) => `<option value="${a.id}" ${i===1?'selected':''}>${a.name}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" style="padding:12px;" onclick="App.saveTxModal()">Save Transaction</button>
    `;
    document.getElementById('modal').classList.add('open');
  },

  saveTxModal() {
    const type = document.getElementById('m-type').value;
    const date = document.getElementById('m-date').value;
    const amount = Number(document.getElementById('m-amt').value);
    const currency = document.getElementById('m-curr').value;
    const desc = document.getElementById('m-desc').value.trim() || 'Transaction';
    const accountId = document.getElementById('m-acc').value;
    const categoryId = document.getElementById('m-cat').value;
    const toAccountId = document.getElementById('m-to-acc').value;
    if (!amount || amount <= 0) return alert('Please enter a positive amount');
    this.state.transactions.push({
      id: 'tx_' + Date.now(), type, date, amount, currency, fx: this.state.fxRate,
      desc, accountId, toAccountId: type === 'transfer' ? toAccountId : null, categoryId
    });
    this.save();
    this.closeModal();
    this.render();
  },

  editTx(id) {
    const t = this.state.transactions.find(x => x.id === id);
    if (!t) return;
    if (confirm(`Delete transaction "${t.desc}" (${this.fmt(t.amount, t.currency)})?`)) {
      this.state.transactions = this.state.transactions.filter(x => x.id !== id);
      this.save();
      this.render();
    }
  },

  openFxModal() {
    const r = prompt('Enter Exchange Rate (1 USD = ? KHR):', this.state.fxRate);
    const n = Number(r);
    if (n && n > 100) { this.state.fxRate = n; this.save(); this.render(); }
  },

  reconcileAccount(accId) {
    const acc = this.state.accounts.find(a => a.id === accId);
    const cur = this.getAccBalance(accId);
    const raw = prompt(`Current balance for ${acc.name} is ${this.fmt(cur, acc.currency)}.\nEnter actual statement balance (${acc.currency}):`, cur);
    if (raw === null) return;
    const diff = Number(raw) - cur;
    if (Math.abs(diff) < 0.01) return;
    this.state.transactions.push({
      id: 'tx_' + Date.now(),
      date: new Date().toISOString().slice(0, 10),
      type: diff > 0 ? 'income' : 'expense',
      desc: 'Reconciliation Adjustment (' + acc.name + ')',
      amount: Math.abs(diff),
      currency: acc.currency,
      fx: this.state.fxRate,
      accountId: acc.id,
      categoryId: 'cat_adjust'
    });
    this.save();
    this.render();
  },

  openNewAccountModal() {
    const name = prompt('New Account Name (e.g. ACLEDA Bank, Wing):');
    if (!name) return;
    const curr = confirm('Use USD? (Cancel for KHR)') ? 'USD' : 'KHR';
    const opening = Number(prompt('Opening Balance:', '0')) || 0;
    this.state.accounts.push({ id: 'acc_' + Date.now(), name, type: 'bank', currency: curr, opening, isDebt: opening < 0 });
    this.save();
    this.render();
  },

  addGoalPrompt() {
    const name = prompt('Savings Goal Name:');
    if (!name) return;
    const target = Number(prompt('Target Amount (USD):', '1000')) || 1000;
    this.state.goals.push({ id: 'g_' + Date.now(), name, target, current: 0, monthly: 100, date: '2027-12-31' });
    this.save();
    this.render();
  },

  updateGoal(id, delta) {
    const g = this.state.goals.find(x => x.id === id);
    if (g) { g.current = Math.max(0, g.current + delta); this.save(); this.render(); }
  },

  postRecurring(id) {
    const r = this.state.recurring.find(x => x.id === id);
    if (!r) return;
    const m = this.state.month;
    this.state.transactions.push({
      id: 'tx_' + Date.now(),
      date: `${m}-${String(r.day).padStart(2, '0')}`,
      type: r.type,
      desc: r.desc,
      amount: r.amount,
      currency: r.currency,
      fx: this.state.fxRate,
      accountId: r.accountId,
      categoryId: r.categoryId
    });
    r.lastPosted = m;
    this.save();
    this.render();
  },

  downloadBackup() {
    const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `MyMoneyPro_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  },

  restoreBackup(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        this.state = JSON.parse(ev.target.result);
        this.save();
        this.init();
      } catch (err) { alert('Invalid backup JSON'); }
    };
    reader.readAsText(f);
  },

  closeModal() { document.getElementById('modal').classList.remove('open'); }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
