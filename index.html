<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <title>MyMoney Pro</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #131b2e; --card-alt: #1c2640; --border: #263354;
      --text: #f8fafc; --muted: #94a3b8; --primary: #6366f1;
      --green: #10b981; --red: #f43f5e; --amber: #f59e0b; --cyan: #06b6d4;
    }
    body.light {
      --bg: #f1f5f9; --card: #ffffff; --card-alt: #f8fafc; --border: #cbd5e1;
      --text: #0f172a; --muted: #64748b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding-bottom: 90px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 30; background: var(--card);
      border-bottom: 1px solid var(--border); padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px; background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px; color: #fff;
    }
    .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    input, select, button {
      font-family: inherit; font-size: 13px; color: var(--text);
      background: var(--card-alt); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; outline: none;
    }
    button { cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-red { background: rgba(244,63,94,0.18); border-color: var(--red); color: var(--red); }
    .btn-block { width: 100%; padding: 12px; font-size: 14px; }
    .container { max-width: 920px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .kpi-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: 600; }
    .kpi-val { font-size: 19px; font-weight: 800; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-muted { color: var(--muted); font-size: 12px; }
    .progress-track { width: 100%; height: 8px; background: var(--card-alt); border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; border-radius: 99px; }
    .row-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .row-item:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; background: var(--card-alt); color: var(--muted); }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--card); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(6, 1fr); padding: 4px 2px;
    }
    .nav-btn {
      background: transparent; border: none; padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--muted);
    }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .fab {
      position: fixed; right: 16px; bottom: 72px; z-index: 45;
      width: 54px; height: 54px; border-radius: 18px; background: var(--primary);
      color: #fff; font-size: 26px; font-weight: 700; border: none;
      box-shadow: 0 6px 20px rgba(99,102,241,0.5);
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.75);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--card); border: 1px solid var(--border);
      width: 100%; max-width: 540px; max-height: 90vh;
      border-radius: 20px 20px 0 0; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .field-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; font-weight: 600; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip { white-space: nowrap; font-size: 12px; padding: 6px 11px; border-radius: 99px; background: var(--card-alt); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <div style="font-weight:800; font-size:15px;">MyMoney Pro</div>
        <div class="text-muted">Clean Personal Ledger</div>
      </div>
    </div>
    <div class="controls">
      <input type="month" id="ctrl-month" onchange="App.setMonth(this.value)" />
      <select id="ctrl-curr" onchange="App.setCurrency(this.value)">
        <option value="USD">USD ($)</option>
        <option value="KHR">KHR (៛)</option>
      </select>
      <button onclick="App.toggleTheme()">☀️</button>
    </div>
  </header>

  <main class="container" id="main-view">
    <div class="card" style="text-align:center; padding:24px;">
      <div style="font-weight:700; margin-bottom:8px;">Starting MyMoney Pro...</div>
      <button class="btn-primary" onclick="localStorage.clear(); location.reload();">Reset Storage & Reload</button>
    </div>
  </main>

  <button class="fab" onclick="App.openTxModal()">+</button>
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div class="modal-backdrop" id="modal" onclick="if(event.target===this)App.closeModal()">
    <div class="modal-box" id="modal-body"></div>
  </div>

<script>
window.onerror = function(msg, src, line) {
  var el = document.getElementById('main-view');
  if (el) {
    el.innerHTML = '<div class="card"><strong class="text-red">Startup Error (Line ' + line + '):</strong><p class="text-muted">' + msg + '</p><button class="btn-primary" onclick="localStorage.clear();location.reload();">Clear Cache & Fix</button></div>';
  }
};

try {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var i = 0; i < regs.length; i++) regs[i].unregister();
    });
  }
  localStorage.removeItem('mymoney_pro_v3_state');
  localStorage.removeItem('mymoney_pro_state_v2');
} catch (e) {}

var STORAGE_KEY = 'mymoney_clean_v5';

var DEFAULT_CATEGORIES = [
  { id: 'cat_salary', name: 'Salary & Payroll', type: 'income', icon: '💼', color: '#10b981' },
  { id: 'cat_business', name: 'Business & Freelance', type: 'income', icon: '🚀', color: '#34d399' },
  { id: 'cat_food', name: 'Food & Dining', type: 'expense', icon: '🍜', color: '#f59e0b' },
  { id: 'cat_groceries', name: 'Groceries & Market', type: 'expense', icon: '🛒', color: '#84cc16' },
  { id: 'cat_housing', name: 'Rent & Housing', type: 'expense', icon: '🏠', color: '#6366f1' },
  { id: 'cat_utilities', name: 'Electricity, Water & Net', type: 'expense', icon: '⚡', color: '#06b6d4' },
  { id: 'cat_transport', name: 'Fuel & Transport', type: 'expense', icon: '🛵', color: '#ec4899' },
  { id: 'cat_shopping', name: 'Shopping & Household', type: 'expense', icon: '🛍️', color: '#8b5cf6' },
  { id: 'cat_health', name: 'Health & Medical', type: 'expense', icon: '🏥', color: '#ef4444' },
  { id: 'cat_edu', name: 'Education & Courses', type: 'expense', icon: '🎓', color: '#3b82f6' },
  { id: 'cat_adjust', name: 'Reconciliation Adjustment', type: 'both', icon: '⚖️', color: '#64748b' }
];

var TABS = [
  { id: 'dashboard', label: 'Home', icon: '📊' },
  { id: 'transactions', label: 'Ledger', icon: '🧾' },
  { id: 'budgets', label: 'Budget', icon: '🎯' },
  { id: 'accounts', label: 'Accounts', icon: '🏦' },
  { id: 'goals', label: 'Goals', icon: '🏆' },
  { id: 'more', label: 'Tools', icon: '⚙️' }
];

var App = {
  state: null,
  tab: 'dashboard',
  filter: { q: '', type: 'ALL', acc: 'ALL' },

  defaultState: function() {
    var m = new Date().toISOString().slice(0, 7);
    return {
      month: m,
      currency: 'USD',
      fxRate: 4050,
      theme: 'dark',
      categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
      accounts: [],
      transactions: [],
      budgets: {},
      goals: [],
      recurring: []
    };
  },

  init: function() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? JSON.parse(raw) : this.defaultState();
      if (!this.state || !Array.isArray(this.state.transactions)) this.state = this.defaultState();
    } catch (e) {
      this.state = this.defaultState();
    }
    document.getElementById('ctrl-month').value = this.state.month;
    document.getElementById('ctrl-curr').value = this.state.currency;
    document.body.classList.toggle('light', this.state.theme === 'light');
    this.renderNav();
    this.render();
  },

  save: function() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
  },

  conv: function(amt, from, to, rate) {
    var n = Number(amt) || 0;
    if (from === to) return n;
    var fx = Number(rate) || this.state.fxRate || 4050;
    return from === 'USD' ? Math.round(n * fx) : +(n / fx).toFixed(2);
  },

  fmt: function(amt, curr) {
    var c = curr || this.state.currency;
    var n = Number(amt) || 0;
    if (c === 'KHR') return Math.round(n).toLocaleString('en-US') + ' ៛';
    return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  getCat: function(id) {
    for (var i = 0; i < this.state.categories.length; i++) {
      if (this.state.categories[i].id === id) return this.state.categories[i];
    }
    return { id: 'cat_adjust', name: 'General', icon: '📌', color: '#6366f1' };
  },

  getAccBalance: function(accId) {
    var acc = null;
    for (var i = 0; i < this.state.accounts.length; i++) {
      if (this.state.accounts[i].id === accId) acc = this.state.accounts[i];
    }
    if (!acc) return 0;
    var bal = Number(acc.opening) || 0;
    for (var j = 0; j < this.state.transactions.length; j++) {
      var t = this.state.transactions[j];
      var fx = t.fx || this.state.fxRate;
      if (t.accountId === accId) {
        var v = this.conv(t.amount, t.currency, acc.currency, fx);
        if (t.type === 'income' || t.type === 'refund') bal += v;
        else bal -= v;
      }
      if (t.type === 'transfer' && t.toAccountId === accId) {
        bal += this.conv(t.amount, t.currency, acc.currency, fx);
      }
    }
    return acc.currency === 'KHR' ? Math.round(bal) : +bal.toFixed(2);
  },

  getMetrics: function(month) {
    var m = month || this.state.month;
    var curr = this.state.currency;
    var income = 0, grossExp = 0, refunds = 0, transfers = 0;
    var byCat = {};
    for (var i = 0; i < this.state.transactions.length; i++) {
      var t = this.state.transactions[i];
      if (!t.date || t.date.indexOf(m) !== 0) continue;
      var v = this.conv(t.amount, t.currency, curr, t.fx);
      if (t.type === 'transfer') { transfers += v; continue; }
      if (t.type === 'income') { income += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
      else if (t.type === 'expense') { grossExp += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
      else if (t.type === 'refund') { refunds += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) - v; }
    }
    var netExp = Math.max(0, grossExp - refunds);
    var assets = 0, debt = 0;
    for (var j = 0; j < this.state.accounts.length; j++) {
      var a = this.state.accounts[j];
      var b = this.conv(this.getAccBalance(a.id), a.currency, curr, this.state.fxRate);
      if (a.isDebt || b < 0) debt += Math.abs(b);
      else assets += b;
    }
    return { income: income, netExp: netExp, refunds: refunds, netFlow: income - netExp, transfers: transfers, byCat: byCat, assets: assets, debt: debt, netWorth: assets - debt };
  },

  setMonth: function(m) { if (m) { this.state.month = m; this.save(); this.render(); } },
  setCurrency: function(c) { this.state.currency = c; this.save(); this.render(); },
  toggleTheme: function() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', this.state.theme === 'light');
    this.save();
  },

  switchTab: function(t) {
    this.tab = t;
    this.renderNav();
    this.render();
    window.scrollTo(0, 0);
  },

  renderNav: function() {
    var html = '';
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      html += '<button class="nav-btn ' + (this.tab === t.id ? 'active' : '') + '" onclick="App.switchTab(\'' + t.id + '\')">' +
              '<span style="font-size:17px;">' + t.icon + '</span><span>' + t.label + '</span></button>';
    }
    document.getElementById('bottom-nav').innerHTML = html;
  },

  render: function() {
    var el = document.getElementById('main-view');
    if (this.tab === 'dashboard') this.renderDashboard(el);
    else if (this.tab === 'transactions') this.renderTransactions(el);
    else if (this.tab === 'budgets') this.renderBudgets(el);
    else if (this.tab === 'accounts') this.renderAccounts(el);
    else if (this.tab === 'goals') this.renderGoals(el);
    else this.renderMore(el);
  },

  renderDashboard: function(el) {
    var m = this.state.month;
    var curr = this.state.currency;
    var k = this.getMetrics(m);
    var bObj = this.state.budgets[m] || { overallUSD: 0, cats: {} };
    var budgetTotal = this.conv(bObj.overallUSD || 0, 'USD', curr, this.state.fxRate);
    var budgetPct = budgetTotal > 0 ? Math.min(100, (k.netExp / budgetTotal) * 100) : 0;

    var setupBanner = this.state.accounts.length === 0 ? (
      '<div class="card" style="border:1px dashed var(--primary); text-align:center;">' +
        '<div style="font-weight:800; font-size:15px; margin-bottom:4px;">Welcome! Your Ledger is 100% Clean</div>' +
        '<div class="text-muted" style="margin-bottom:12px;">Add your first real account (Bank, KHQR, Cash, or Credit Card) to begin recording transactions.</div>' +
        '<button class="btn-primary" onclick="App.openAccountModal()">+ Add Your First Account</button>' +
      '</div>'
    ) : '';

    var accHtml = '';
    for (var i = 0; i < this.state.accounts.length; i++) {
      var a = this.state.accounts[i];
      var bal = this.getAccBalance(a.id);
      accHtml += '<div class="row-item" onclick="App.openAccountModal(\'' + a.id + '\')">' +
        '<div><div style="font-weight:600; font-size:13px;">' + a.name + '</div><div class="text-muted">' + a.type.toUpperCase() + ' • ' + a.currency + '</div></div>' +
        '<div style="font-weight:700;" class="' + (bal < 0 ? 'text-red' : 'text-green') + '">' + this.fmt(bal, a.currency) + '</div></div>';
    }
    if (!accHtml) accHtml = '<div class="text-muted">No accounts added yet.</div>';

    var recentList = this.state.transactions.filter(function(t) { return t.date && t.date.indexOf(m) === 0; }).slice(-6).reverse();

    el.innerHTML =
      '<div class="chips">' +
        '<button class="chip" onclick="App.openFxModal()">💱 1 USD = ' + this.state.fxRate.toLocaleString() + ' KHR</button>' +
        '<button class="chip" onclick="App.openAccountModal()">+ Account</button>' +
        '<button class="chip" onclick="App.openTxModal(null, \'expense\')">+ Expense</button>' +
        '<button class="chip" onclick="App.openTxModal(null, \'income\')">+ Income</button>' +
        '<button class="chip" onclick="App.openTxModal(null, \'transfer\')">⇄ Transfer</button>' +
      '</div>' +
      setupBanner +
      '<div class="grid-2">' +
        '<div class="card" onclick="App.switchTab(\'transactions\')">' +
          '<div class="kpi-title"><span>INCOME (' + m + ')</span><span class="text-green">↑ IN</span></div>' +
          '<div class="kpi-val text-green">' + this.fmt(k.income) + '</div>' +
        '</div>' +
        '<div class="card" onclick="App.switchTab(\'transactions\')">' +
          '<div class="kpi-title"><span>NET EXPENSES</span><span class="text-red">↓ OUT</span></div>' +
          '<div class="kpi-val text-red">' + this.fmt(k.netExp) + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="kpi-title"><span>NET CASH FLOW</span><span>💧</span></div>' +
          '<div class="kpi-val ' + (k.netFlow >= 0 ? 'text-green' : 'text-red') + '">' + (k.netFlow >= 0 ? '+' : '') + this.fmt(k.netFlow) + '</div>' +
        '</div>' +
        '<div class="card" onclick="App.switchTab(\'accounts\')">' +
          '<div class="kpi-title"><span>NET WORTH</span><span>🏦</span></div>' +
          '<div class="kpi-val">' + this.fmt(k.netWorth) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card" onclick="App.switchTab(\'budgets\')">' +
        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
          '<div><div style="font-weight:700; font-size:14px;">Monthly Budget (' + m + ')</div>' +
          '<div class="text-muted">' + (budgetTotal > 0 ? (this.fmt(k.netExp) + ' of ' + this.fmt(budgetTotal)) : 'Tap to set monthly budget') + '</div></div>' +
          '<span class="badge">' + (budgetTotal > 0 ? (budgetPct.toFixed(0) + '%') : 'Set →') + '</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + budgetPct + '%; background:var(--green);"></div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
          '<span style="font-weight:700; font-size:14px;">Accounts (' + this.state.accounts.length + ')</span>' +
          '<button onclick="App.openAccountModal()" style="padding:4px 10px; font-size:12px;">+ Add</button>' +
        '</div>' + accHtml +
      '</div>' +
      '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
          '<span style="font-weight:700; font-size:14px;">Recent Transactions</span>' +
          '<span class="text-muted" onclick="App.switchTab(\'transactions\')">All →</span>' +
        '</div>' + this.renderTxRows(recentList) +
      '</div>';
  },

  renderTxRows: function(list) {
    if (!list || !list.length) return '<div class="text-muted" style="padding:10px 0;">No transactions recorded yet.</div>';
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      var cat = this.getCat(t.categoryId);
      var cls = (t.type === 'income' || t.type === 'refund') ? 'text-green' : (t.type === 'transfer' ? '' : 'text-red');
      var sign = (t.type === 'income' || t.type === 'refund') ? '+' : (t.type === 'transfer' ? '⇄ ' : '-');
      html += '<div class="row-item" onclick="App.openTxModal(\'' + t.id + '\')">' +
        '<div style="display:flex; align-items:center; gap:10px;">' +
          '<div style="font-size:20px;">' + (t.type === 'transfer' ? '🔄' : cat.icon) + '</div>' +
          '<div><div style="font-weight:600; font-size:13px;">' + t.desc + '</div>' +
          '<div class="text-muted">' + t.date + ' • ' + cat.name + '</div></div>' +
        '</div>' +
        '<div style="text-align:right;"><div style="font-weight:700; font-size:13px;" class="' + cls + '">' + sign + this.fmt(t.amount, t.currency) + '</div>' +
        '<div class="text-muted">Edit</div></div></div>';
    }
    return html;
  },

  renderTransactions: function(el) {
    var self = this;
    var list = this.state.transactions.filter(function(t) {
      if (self.filter.q && (t.desc || '').toLowerCase().indexOf(self.filter.q.toLowerCase()) === -1) return false;
      if (self.filter.type !== 'ALL' && t.type !== self.filter.type) return false;
      return true;
    }).slice().reverse();

    el.innerHTML =
      '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
          '<span style="font-weight:700; font-size:15px;">Transactions (' + list.length + ')</span>' +
          '<button class="btn-primary" onclick="App.openTxModal()">+ Add</button>' +
        '</div>' +
        '<div class="grid-2">' +
          '<input placeholder="Search..." value="' + this.filter.q + '" oninput="App.filter.q=this.value; App.render()" />' +
          '<select onchange="App.filter.type=this.value; App.render()">' +
            '<option value="ALL">All Types</option>' +
            '<option value="expense" ' + (this.filter.type === 'expense' ? 'selected' : '') + '>Expenses</option>' +
            '<option value="income" ' + (this.filter.type === 'income' ? 'selected' : '') + '>Income</option>' +
            '<option value="refund" ' + (this.filter.type === 'refund' ? 'selected' : '') + '>Refunds</option>' +
            '<option value="transfer" ' + (this.filter.type === 'transfer' ? 'selected' : '') + '>Transfers</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="card">' + this.renderTxRows(list) + '</div>';
  },

  renderBudgets: function(el) {
    var m = this.state.month;
    var curr = this.state.currency;
    if (!this.state.budgets[m]) this.state.budgets[m] = { overallUSD: 0, cats: {} };
    var b = this.state.budgets[m];
    var k = this.getMetrics(m);

    var catRows = '';
    for (var i = 0; i < this.state.categories.length; i++) {
      var cat = this.state.categories[i];
      if (cat.type !== 'expense') continue;
      var limitUSD = Number(b.cats[cat.id] || 0);
      var limitCurr = this.conv(limitUSD, 'USD', curr, this.state.fxRate);
      var spent = Math.max(0, k.byCat[cat.id] || 0);
      var pct = limitCurr > 0 ? Math.min(100, (spent / limitCurr) * 100) : 0;
      catRows += '<div style="padding:10px 0; border-bottom:1px solid var(--border);">' +
        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
          '<span style="font-weight:600; font-size:13px;">' + cat.icon + ' ' + cat.name + '</span>' +
          '<input type="number" step="any" value="' + (limitUSD || '') + '" placeholder="USD Limit" style="width:100px;" ' +
            'onchange="App.state.budgets[\'' + m + '\'].cats[\'' + cat.id + '\']=Number(this.value)||0; App.save(); App.render()" />' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%; background:var(--green);"></div></div>' +
        '<div class="text-muted">Spent: ' + this.fmt(spent) + ' / ' + this.fmt(limitCurr) + '</div></div>';
    }

    el.innerHTML =
      '<div class="card">' +
        '<div style="font-weight:700; font-size:15px; margin-bottom:8px;">Monthly Master Budget (' + m + ')</div>' +
        '<label class="field-label">Total Monthly Budget Limit (USD)</label>' +
        '<input type="number" step="any" value="' + (b.overallUSD || '') + '" placeholder="0.00" style="width:100%; font-weight:700;" ' +
          'onchange="App.state.budgets[\'' + m + '\'].overallUSD=Number(this.value)||0; App.save(); App.render()" />' +
      '</div>' +
      '<div class="card"><div style="font-weight:700; font-size:14px; margin-bottom:8px;">Category Limits (USD)</div>' + catRows + '</div>';
  },

  renderAccounts: function(el) {
    var k = this.getMetrics();
    var rows = '';
    for (var i = 0; i < this.state.accounts.length; i++) {
      var a = this.state.accounts[i];
      var bal = this.getAccBalance(a.id);
      rows += '<div class="row-item" onclick="App.openAccountModal(\'' + a.id + '\')">' +
        '<div><div style="font-weight:700;">' + a.name + '</div><div class="text-muted">' + a.type.toUpperCase() + ' • ' + a.currency + ' (Tap to edit)</div></div>' +
        '<strong class="' + (bal < 0 ? 'text-red' : 'text-green') + '">' + this.fmt(bal, a.currency) + '</strong></div>';
    }
    el.innerHTML =
      '<div class="grid-2">' +
        '<div class="card"><div class="kpi-title">ASSETS</div><div class="kpi-val text-green">' + this.fmt(k.assets) + '</div></div>' +
        '<div class="card"><div class="kpi-title">LIABILITIES</div><div class="kpi-val text-red">' + this.fmt(k.debt) + '</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
          '<span style="font-weight:700; font-size:15px;">Accounts (' + this.state.accounts.length + ')</span>' +
          '<button class="btn-primary" onclick="App.openAccountModal()">+ Add Account</button>' +
        '</div>' + (rows || '<div class="text-muted">No accounts added yet.</div>') +
      '</div>';
  },

  renderGoals: function(el) {
    var rows = '';
    for (var i = 0; i < this.state.goals.length; i++) {
      var g = this.state.goals[i];
      var pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0;
      rows += '<div class="card">' +
        '<div style="display:flex; justify-content:space-between;"><strong>🎯 ' + g.name + '</strong>' +
        '<span class="text-green" style="font-weight:700;">' + this.fmt(g.current, 'USD') + ' / ' + this.fmt(g.target, 'USD') + '</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%; background:var(--primary);"></div></div>' +
        '<div style="display:flex; gap:6px; margin-top:8px;">' +
          '<button class="btn-green" onclick="App.adjustGoal(\'' + g.id + '\', 50)">+$50</button>' +
          '<button class="btn-green" onclick="App.adjustGoal(\'' + g.id + '\', 100)">+$100</button>' +
          '<button class="btn-red" onclick="App.deleteGoal(\'' + g.id + '\')">Delete</button>' +
        '</div></div>';
    }
    el.innerHTML =
      '<div class="card" style="display:flex; justify-content:space-between; align-items:center;">' +
        '<span style="font-weight:700; font-size:15px;">Savings Goals</span>' +
        '<button class="btn-primary" onclick="App.openGoalModal()">+ New Goal</button>' +
      '</div>' + (rows || '<div class="card text-muted">No savings goals created yet.</div>');
  },

  renderMore: function(el) {
    el.innerHTML =
      '<div class="card">' +
        '<div style="font-weight:700; font-size:15px; margin-bottom:10px;">💾 Backup, Export & Reset</div>' +
        '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">' +
          '<button class="btn-primary" onclick="App.downloadBackup()">⬇️ Download JSON Backup</button>' +
          '<button class="btn-red" onclick="if(confirm(\'Erase all data?\')){localStorage.clear();location.reload();}">🗑️ Wipe All Data</button>' +
        '</div>' +
        '<label class="field-label">Restore from JSON Backup file:</label>' +
        '<input type="file" accept=".json" onchange="App.restoreBackup(event)" style="width:100%;" />' +
      '</div>';
  },

  openModal: function(html) {
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal').classList.add('open');
  },
  closeModal: function() {
    document.getElementById('modal').classList.remove('open');
  },

  openAccountModal: function(accId) {
    var existing = null;
    for (var i = 0; i < this.state.accounts.length; i++) {
      if (this.state.accounts[i].id === accId) existing = this.state.accounts[i];
    }
    var a = existing || { name: '', type: 'bank', currency: 'USD', opening: '' };
    this.openModal(
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<strong>' + (existing ? 'Edit Account' : 'Add Account') + '</strong>' +
        '<button onclick="App.closeModal()">✕</button>' +
      '</div>' +
      '<div><label class="field-label">Account Name</label>' +
      '<input id="acc-name" value="' + a.name + '" placeholder="e.g. ABA Bank, Bakong KHR, Cash" style="width:100%;" /></div>' +
      '<div class="grid-2">' +
        '<div><label class="field-label">Type</label><select id="acc-type" style="width:100%;">' +
          '<option value="bank">Bank</option><option value="ewallet">E-Wallet</option><option value="cash">Cash</option><option value="savings">Savings</option><option value="credit">Credit Card</option>' +
        '</select></div>' +
        '<div><label class="field-label">Currency</label><select id="acc-curr" style="width:100%;">' +
          '<option value="USD" ' + (a.currency === 'USD' ? 'selected' : '') + '>USD ($)</option>' +
          '<option value="KHR" ' + (a.currency === 'KHR' ? 'selected' : '') + '>KHR (៛)</option>' +
        '</select></div>' +
      '</div>' +
      '<div><label class="field-label">Opening Balance</label>' +
      '<input id="acc-open" type="number" step="any" value="' + a.opening + '" placeholder="0.00" style="width:100%;" /></div>' +
      '<div style="display:flex; gap:8px;">' +
        (existing ? '<button class="btn-red" onclick="App.deleteAccount(\'' + existing.id + '\')">Delete</button>' : '') +
        '<button class="btn-primary btn-block" onclick="App.saveAccount(\'' + (existing ? existing.id : '') + '\')">Save Account</button>' +
      '</div>'
    );
  },

  saveAccount: function(id) {
    var name = document.getElementById('acc-name').value.trim();
    var type = document.getElementById('acc-type').value;
    var currency = document.getElementById('acc-curr').value;
    var opening = Number(document.getElementById('acc-open').value) || 0;
    if (!name) return alert('Enter an account name.');
    var isDebt = type === 'credit' || opening < 0;
    if (id) {
      for (var i = 0; i < this.state.accounts.length; i++) {
        if (this.state.accounts[i].id === id) {
          this.state.accounts[i] = { id: id, name: name, type: type, currency: currency, opening: opening, isDebt: isDebt };
        }
      }
    } else {
      this.state.accounts.push({ id: 'acc_' + Date.now(), name: name, type: type, currency: currency, opening: opening, isDebt: isDebt });
    }
    this.save();
    this.closeModal();
    this.render();
  },

  deleteAccount: function(id) {
    this.state.accounts = this.state.accounts.filter(function(a) { return a.id !== id; });
    this.save();
    this.closeModal();
    this.render();
  },

  openTxModal: function(txId, defaultType) {
    if (this.state.accounts.length === 0) return this.openAccountModal();
    var existing = null;
    for (var i = 0; i < this.state.transactions.length; i++) {
      if (this.state.transactions[i].id === txId) existing = this.state.transactions[i];
    }
    var t = existing || {
      type: defaultType || 'expense',
      date: new Date().toISOString().slice(0, 10),
      amount: '',
      currency: this.state.accounts[0].currency || 'USD',
      desc: '',
      accountId: this.state.accounts[0].id,
      toAccountId: (this.state.accounts[1] || this.state.accounts[0]).id,
      categoryId: 'cat_food'
    };

    var accOpts = '';
    var toAccOpts = '';
    for (var j = 0; j < this.state.accounts.length; j++) {
      var a = this.state.accounts[j];
      accOpts += '<option value="' + a.id + '" ' + (t.accountId === a.id ? 'selected' : '') + '>' + a.name + ' (' + a.currency + ')</option>';
      toAccOpts += '<option value="' + a.id + '" ' + (t.toAccountId === a.id ? 'selected' : '') + '>' + a.name + ' (' + a.currency + ')</option>';
    }

    var catOpts = '';
    for (var k = 0; k < this.state.categories.length; k++) {
      var c = this.state.categories[k];
      catOpts += '<option value="' + c.id + '" ' + (t.categoryId === c.id ? 'selected' : '') + '>' + c.icon + ' ' + c.name + '</option>';
    }

    this.openModal(
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<strong>' + (existing ? 'Edit Transaction' : 'New Transaction') + '</strong>' +
        '<button onclick="App.closeModal()">✕</button>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div><label class="field-label">Type</label><select id="m-type" style="width:100%;" onchange="document.getElementById(\'m-to-wrap\').style.display=this.value===\'transfer\'?\'block\':\'none\'">' +
          '<option value="expense" ' + (t.type === 'expense' ? 'selected' : '') + '>Expense</option>' +
          '<option value="income" ' + (t.type === 'income' ? 'selected' : '') + '>Income</option>' +
          '<option value="refund" ' + (t.type === 'refund' ? 'selected' : '') + '>Refund</option>' +
          '<option value="transfer" ' + (t.type === 'transfer' ? 'selected' : '') + '>Transfer</option>' +
        '</select></div>' +
        '<div><label class="field-label">Date</label><input type="date" id="m-date" value="' + t.date + '" style="width:100%;" /></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div><label class="field-label">Amount</label><input type="number" step="any" id="m-amt" value="' + t.amount + '" placeholder="0.00" style="width:100%; font-weight:700;" /></div>' +
        '<div><label class="field-label">Currency</label><select id="m-curr" style="width:100%;">' +
          '<option value="USD" ' + (t.currency === 'USD' ? 'selected' : '') + '>USD ($)</option>' +
          '<option value="KHR" ' + (t.currency === 'KHR' ? 'selected' : '') + '>KHR (៛)</option>' +
        '</select></div>' +
      '</div>' +
      '<div><label class="field-label">Description</label><input id="m-desc" value="' + t.desc + '" placeholder="e.g. Lunch, Rent, Salary" style="width:100%;" /></div>' +
      '<div class="grid-2">' +
        '<div><label class="field-label">Account</label><select id="m-acc" style="width:100%;">' + accOpts + '</select></div>' +
        '<div><label class="field-label">Category</label><select id="m-cat" style="width:100%;">' + catOpts + '</select></div>' +
      '</div>' +
      '<div id="m-to-wrap" style="display:' + (t.type === 'transfer' ? 'block' : 'none') + ';"><label class="field-label">Transfer To Account</label><select id="m-to-acc" style="width:100%;">' + toAccOpts + '</select></div>' +
      '<div style="display:flex; gap:8px;">' +
        (existing ? '<button class="btn-red" onclick="App.deleteTx(\'' + existing.id + '\')">Delete</button>' : '') +
        '<button class="btn-primary btn-block" onclick="App.saveTx(\'' + (existing ? existing.id : '') + '\')">Save Transaction</button>' +
      '</div>'
    );
  },

  saveTx: function(existingId) {
    var type = document.getElementById('m-type').value;
    var date = document.getElementById('m-date').value;
    var amount = Number(document.getElementById('m-amt').value);
    var currency = document.getElementById('m-curr').value;
    var desc = document.getElementById('m-desc').value.trim() || 'Transaction';
    var accountId = document.getElementById('m-acc').value;
    var categoryId = document.getElementById('m-cat').value;
    var toAccountId = document.getElementById('m-to-acc').value;
    if (!amount || amount <= 0) return alert('Enter a positive amount.');

    var rec = {
      id: existingId || ('tx_' + Date.now()),
      type: type, date: date, amount: amount, currency: currency, fx: this.state.fxRate,
      desc: desc, accountId: accountId, toAccountId: type === 'transfer' ? toAccountId : null, categoryId: categoryId
    };

    if (existingId) {
      for (var i = 0; i < this.state.transactions.length; i++) {
        if (this.state.transactions[i].id === existingId) this.state.transactions[i] = rec;
      }
    } else {
      this.state.transactions.push(rec);
    }
    this.save();
    this.closeModal();
    this.render();
  },

  deleteTx: function(id) {
    this.state.transactions = this.state.transactions.filter(function(t) { return t.id !== id; });
    this.save();
    this.closeModal();
    this.render();
  },

  openGoalModal: function() {
    this.openModal(
      '<div style="display:flex; justify-content:space-between; align-items:center;"><strong>New Savings Goal</strong><button onclick="App.closeModal()">✕</button></div>' +
      '<div><label class="field-label">Goal Name</label><input id="g-name" placeholder="e.g. Emergency Fund" style="width:100%;" /></div>' +
      '<div><label class="field-label">Target Amount (USD)</label><input id="g-target" type="number" step="any" placeholder="1000" style="width:100%;" /></div>' +
      '<button class="btn-primary btn-block" onclick="App.saveGoal()">Create Goal</button>'
    );
  },

  saveGoal: function() {
    var name = document.getElementById('g-name').value.trim();
    var target = Number(document.getElementById('g-target').value) || 0;
    if (!name || target <= 0) return alert('Enter a valid name and target.');
    this.state.goals.push({ id: 'g_' + Date.now(), name: name, target: target, current: 0 });
    this.save();
    this.closeModal();
    this.render();
  },

  adjustGoal: function(id, delta) {
    for (var i = 0; i < this.state.goals.length; i++) {
      if (this.state.goals[i].id === id) this.state.goals[i].current += delta;
    }
    this.save();
    this.render();
  },

  deleteGoal: function(id) {
    this.state.goals = this.state.goals.filter(function(g) { return g.id !== id; });
    this.save();
    this.render();
  },

  openFxModal: function() {
    this.openModal(
      '<div style="display:flex; justify-content:space-between; align-items:center;"><strong>USD ⇄ KHR Exchange Rate</strong><button onclick="App.closeModal()">✕</button></div>' +
      '<div><label class="field-label">1 USD = ? KHR</label><input id="fx-val" type="number" value="' + this.state.fxRate + '" style="width:100%;" /></div>' +
      '<button class="btn-primary btn-block" onclick="App.saveFx()">Save Exchange Rate</button>'
    );
  },

  saveFx: function() {
    var v = Number(document.getElementById('fx-val').value);
    if (v > 100) { this.state.fxRate = v; this.save(); }
    this.closeModal();
    this.render();
  },

  downloadBackup: function() {
    var blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'MyMoneyPro_Backup.json';
    a.click();
  },

  restoreBackup: function(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        App.state = JSON.parse(ev.target.result);
        App.save();
        App.init();
      } catch (err) { alert('Invalid JSON file.'); }
    };
    reader.readAsText(f);
  }
};

App.init();
</script>
</body>
</html>
