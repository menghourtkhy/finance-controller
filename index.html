<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MyMoney — Personal Finance</title>

  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                400: '#818cf8', 500: '#6366f1', 600: '#4f46e5',
                700: '#4338ca', 800: '#3730a3', 900: '#312e81', 950: '#1e1b4b'
              },
              surface: {
                light: '#f8fafc',
                cardLight: '#ffffff',
                dark: '#090d16',
                cardDark: '#111827',
                elevatedDark: '#1e293b'
              }
            }
          }
        }
      };
    }
  </script>

  <!-- Chart.js & SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-main: #f4f6fb;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --brand-primary: #4f46e5;
      --brand-accent: #6366f1;
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.dark {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-elevated: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #1f2937;
      --brand-primary: #6366f1;
      --brand-accent: #818cf8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      transition: background-color 200ms ease, color 200ms ease;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Fintech Surface Cards */
    .fin-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1.125rem;
      transition: transform 140ms var(--ease-out-quart), border-color 180ms ease, box-shadow 180ms ease;
    }
    .fin-card-interactive { cursor: pointer; }
    .fin-card-interactive:active { transform: scale(0.985); }

    /* Restrained Hero Gradient */
    .hero-balance-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #1e293b 100%);
      color: #ffffff;
      border: 1px solid rgba(129, 140, 248, 0.24);
      box-shadow: 0 16px 36px -12px rgba(30, 27, 75, 0.45);
    }

    /* Smooth Sheet & Modal Animations */
    @keyframes sheetSlideUp {
      from { opacity: 0; transform: translateY(28px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeInView {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-sheet { animation: sheetSlideUp 260ms var(--ease-out-quart) forwards; }
    .animate-view { animation: fadeInView 200ms var(--ease-out-quart) forwards; }

    /* Safe Area Support for Android Gesture Bars */
    .pb-safe { padding-bottom: calc(5.25rem + env(safe-area-inset-bottom, 0px)); }
    .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* Press Feedback */
    .btn-press { transition: transform 120ms var(--ease-out-quart), background-color 150ms ease, opacity 150ms ease; }
    .btn-press:active { transform: scale(0.96); }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .fin-card { border: 1px solid #ccc !important; box-shadow: none !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row selection:bg-brand-500 selection:text-white">

  <!-- DESKTOP SIDEBAR NAVIGATION -->
  <aside class="hidden md:flex md:flex-col md:w-64 lg:w-72 bg-white dark:bg-[#0d1321] border-r border-slate-200/80 dark:border-slate-800/80 shrink-0 sticky top-0 h-screen no-print">
    <div class="p-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-md shadow-brand-600/25" id="sidebar-brand-icon"></div>
        <div>
          <span class="font-extrabold text-base tracking-tight block leading-none">MyMoney</span>
          <span class="text-[11px] text-slate-400 font-medium mt-1 block">Personal Wealth OS</span>
        </div>
      </div>
      <button onclick="App.cycleTheme()" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 btn-press" title="Switch Theme" id="desktop-theme-btn"></button>
    </div>

    <div class="px-4 mb-3">
      <button onclick="App.openTxSheet()" class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm shadow-md shadow-brand-600/20 flex items-center justify-center gap-2 btn-press">
        <span id="sidebar-add-icon"></span>
        <span>Add Transaction</span>
      </button>
    </div>

    <nav id="desktop-nav" class="flex-1 px-3 space-y-1 overflow-y-auto text-sm font-medium"></nav>

    <!-- Quick Sub-Modules -->
    <div class="px-4 py-3 border-t border-slate-200/80 dark:border-slate-800/80 space-y-1">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 mb-1">Financial Tools</div>
      <button onclick="App.openSubView('accounts')" class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition">
        <span>Accounts & Net Worth</span>
        <span class="text-slate-400">→</span>
      </button>
      <button onclick="App.openSubView('goals')" class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition">
        <span>Savings Goals</span>
        <span class="text-slate-400">→</span>
      </button>
      <button onclick="App.openSubView('calendar')" class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition">
        <span>Bills & Recurring</span>
        <span class="text-slate-400">→</span>
      </button>
    </div>

    <!-- FX Rate Footer -->
    <div class="p-4 border-t border-slate-200/80 dark:border-slate-800/80">
      <button onclick="App.openFxSheet()" class="w-full p-3 rounded-xl bg-slate-100/80 dark:bg-slate-800/60 hover:bg-slate-200/70 dark:hover:bg-slate-800 flex items-center justify-between text-xs transition">
        <span class="text-slate-500 dark:text-slate-400 font-medium">Exchange Rate</span>
        <span class="font-bold text-brand-600 dark:text-brand-400 tabular-nums" id="sidebar-fx-badge">1 USD = 4,050 ៛</span>
      </button>
    </div>
  </aside>

  <!-- MAIN APPLICATION AREA -->
  <div class="flex-1 flex flex-col min-w-0 pb-safe md:pb-8">
    <!-- COMPACT STICKY TOP HEADER -->
    <header class="sticky top-0 z-30 bg-[#f4f6fb]/85 dark:bg-[#090d16]/85 backdrop-blur-md border-b border-slate-200/70 dark:border-slate-800/80 px-4 sm:px-6 py-3 flex items-center justify-between gap-2 no-print">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="md:hidden w-8 h-8 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-sm shrink-0" id="mobile-brand-icon"></div>
        <div class="min-w-0">
          <div id="header-greeting" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate">Good morning</div>
          <h1 id="header-title" class="font-bold text-sm sm:text-base tracking-tight truncate">MyMoney</h1>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- Month Selector Button -->
        <button onclick="App.openMonthSelectorSheet()" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 text-xs font-semibold flex items-center gap-1.5 shadow-2xs btn-press">
          <span id="header-cal-icon" class="text-brand-500"></span>
          <span id="header-month-label" class="tabular-nums">Oct 2026</span>
        </button>

        <!-- Currency Toggle Pill -->
        <button onclick="App.toggleReportCurrency()" id="header-curr-btn"
          class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 text-xs font-bold text-brand-600 dark:text-brand-400 tabular-nums btn-press"
          title="Switch Reporting Currency">
          USD ($)
        </button>

        <!-- Due Bills / Reminder Bell -->
        <button onclick="App.openSubView('calendar')" id="header-bell-btn"
          class="relative p-2 rounded-xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 btn-press"
          title="Upcoming Bills & Reminders">
          <span id="header-bell-icon"></span>
          <span id="header-bell-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-amber-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </header>

    <!-- VIEWPORT CONTAINER -->
    <main id="app-view" class="flex-1 px-4 sm:px-6 pt-4 max-w-6xl w-full mx-auto space-y-5 animate-view"></main>
  </div>

  <!-- MOBILE FLOATING ACTION BUTTON (THUMB ZONE) -->
  <button onclick="App.openTxSheet()" aria-label="Add Transaction"
    class="md:hidden fixed right-4 bottom-20 z-30 w-14 h-14 rounded-2xl bg-brand-600 hover:bg-brand-500 text-white shadow-xl shadow-brand-600/35 flex items-center justify-center btn-press no-print"
    id="mobile-fab-btn">
  </button>

  <!-- MOBILE BOTTOM NAVIGATION BAR (5 PRIMARY DESTINATIONS) -->
  <nav id="mobile-nav" aria-label="Primary Navigation"
    class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-[#0d1321]/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800/80 grid grid-cols-5 bottom-nav-safe no-print">
  </nav>

  <!-- PRIMARY SHEET / MODAL LAYER -->
  <div id="sheet-backdrop" onclick="if(event.target===this) App.closeSheet()"
    class="fixed inset-0 z-40 hidden bg-slate-950/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity no-print">
    <div id="sheet-panel"
      class="bg-white dark:bg-[#111827] border-t sm:border border-slate-200/80 dark:border-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90dvh] flex flex-col shadow-2xl overflow-hidden animate-sheet">
    </div>
  </div>

  <!-- SECONDARY PICKER / CONFIRMATION SHEET LAYER (STACKABLE FOR CATEGORY/ACCOUNT/DATE SELECTORS) -->
  <div id="subsheet-backdrop" onclick="if(event.target===this) App.closeSubSheet()"
    class="fixed inset-0 z-50 hidden bg-slate-950/60 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
    <div id="subsheet-panel"
      class="bg-white dark:bg-[#111827] border-t sm:border border-slate-200/80 dark:border-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85dvh] flex flex-col shadow-2xl overflow-hidden animate-sheet">
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" aria-live="polite"
    class="fixed top-16 sm:top-5 right-4 left-4 sm:left-auto sm:w-88 z-50 flex flex-col gap-2 pointer-events-none no-print">
  </div>

  readIndexedDB() {
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction(DB_STORE, 'readonly');
          const getReq = tx.objectStore(DB_STORE).get('root');
          getReq.onsuccess = () => resolve(getReq.result || null);
          getReq.onerror = () => resolve(null);
        };
        req.onerror = () => resolve(null);
      } catch (_) { resolve(null); }
    });
  },

  writeIndexedDB(data) {
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) return resolve();
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(data, 'root');
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        };
        req.onerror = () => resolve();
      } catch (_) { resolve(); }
    });
  },

  // ============================================================================
  // CURRENCY & FINANCIAL ENGINE (USD & KHR)
  // ============================================================================
  convertAmount(amount, fromCurr, toCurr, customRate) {
    const num = Number(amount) || 0;
    if (fromCurr === toCurr) return num;
    const rate = Number(customRate) || this.state.settings.fxRateKHR || 4050;
    if (fromCurr === 'USD' && toCurr === 'KHR') return Math.round(num * rate);
    if (fromCurr === 'KHR' && toCurr === 'USD') return +(num / rate).toFixed(2);
    return num;
  },

  formatMoney(amount, currency = this.state.settings.reportCurrency, allowPrivacyMask = false) {
    if (allowPrivacyMask && this.state.settings.hideBalance) {
      return currency === 'KHR' ? '•••••• ៛' : '$••••••';
    }
    const val = Number(amount) || 0;
    const sign = val < 0 ? '-' : '';
    if (currency === 'KHR') {
      return sign + Math.round(Math.abs(val)).toLocaleString('en-US') + ' ៛';
    }
    return sign + '$' + Math.abs(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  txInReportCurrency(tx, targetCurr = this.state.settings.reportCurrency) {
    return this.convertAmount(tx.amount, tx.currency, targetCurr, tx.fxRateUsed || this.state.settings.fxRateKHR);
  },

  getAccountBalance(accountId) {
    const acc = this.state.accounts.find(a => a.id === accountId);
    if (!acc) return 0;
    let bal = Number(acc.openingBalance) || 0;
    for (const tx of this.state.transactions) {
      const rate = tx.fxRateUsed || this.state.settings.fxRateKHR;
      if (tx.accountId === accountId) {
        const amtInAcc = this.convertAmount(tx.amount, tx.currency, acc.currency, rate);
        if (tx.type === 'income' || tx.type === 'refund') bal += amtInAcc;
        else if (tx.type === 'expense' || tx.type === 'transfer') bal -= amtInAcc;
      }
      if (tx.type === 'transfer' && tx.toAccountId === accountId) {
        const recvAmt = tx.toAmount ? Number(tx.toAmount) : this.convertAmount(tx.amount, tx.currency, acc.currency, rate);
        bal += recvAmt;
      }
    }
    return acc.currency === 'KHR' ? Math.round(bal) : +bal.toFixed(2);
  },

  getConsolidatedBalanceSummary(targetCurr = this.state.settings.reportCurrency) {
    let availableAssets = 0;
    let liabilities = 0;
    let rawUSD = 0;
    let rawKHR = 0;

    for (const acc of this.state.accounts) {
      const bal = this.getAccountBalance(acc.id);
      const conv = this.convertAmount(bal, acc.currency, targetCurr, this.state.settings.fxRateKHR);
      if (acc.isLiability || bal < 0) {
        liabilities += Math.abs(conv);
      } else {
        availableAssets += conv;
        if (acc.currency === 'USD') rawUSD += bal;
        if (acc.currency === 'KHR') rawKHR += bal;
      }
    }
    return {
      availableAssets,
      liabilities,
      netWorth: availableAssets - liabilities,
      rawUSD,
      rawKHR
    };
  },

  getPeriodMetrics(monthOrRange, targetCurr = this.state.settings.reportCurrency, filterOpts = {}) {
    let income = 0;
    let grossExpense = 0;
    let refunds = 0;
    let transfersVolume = 0;
    const byCategory = {};

    const txs = this.state.transactions.filter(tx => {
      if (typeof monthOrRange === 'string') {
        if (!tx.date.startsWith(monthOrRange)) return false;
      } else if (monthOrRange && monthOrRange.from && monthOrRange.to) {
        if (tx.date < monthOrRange.from || tx.date > monthOrRange.to) return false;
      }
      if (filterOpts.accountId && filterOpts.accountId !== 'ALL' && tx.accountId !== filterOpts.accountId && tx.toAccountId !== filterOpts.accountId) return false;
      return true;
    });

    for (const tx of txs) {
      const val = this.txInReportCurrency(tx, targetCurr);
      if (tx.type === 'transfer') {
        transfersVolume += val;
        continue;
      }
      if (tx.type === 'income') {
        if (tx.splits && tx.splits.length) {
          tx.splits.forEach(s => {
            const sv = this.convertAmount(s.amount, tx.currency, targetCurr, tx.fxRateUsed);
            income += sv;
            byCategory[s.categoryId] = (byCategory[s.categoryId] || 0) + sv;
          });
        } else {
          income += val;
          byCategory[tx.categoryId] = (byCategory[tx.categoryId] || 0) + val;
        }
      } else if (tx.type === 'expense') {
        if (tx.splits && tx.splits.length) {
          tx.splits.forEach(s => {
            const sv = this.convertAmount(s.amount, tx.currency, targetCurr, tx.fxRateUsed);
            grossExpense += sv;
            byCategory[s.categoryId] = (byCategory[s.categoryId] || 0) + sv;
          });
        } else {
          grossExpense += val;
          byCategory[tx.categoryId] = (byCategory[tx.categoryId] || 0) + val;
        }
      } else if (tx.type === 'refund') {
        refunds += val;
        byCategory[tx.categoryId] = (byCategory[tx.categoryId] || 0) - val;
      }
    }

    const netExpense = Math.max(0, grossExpense - refunds);
    return { income, grossExpense, refunds, netExpense, netCashFlow: income - netExpense, transfersVolume, byCategory, txCount: txs.length };
  },

  getPreviousMonthStr(ym) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  },

  formatMonthDisplay(ym) {
    if (!ym) return '';
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  },

  getBudgetForMonth(month, targetCurr = this.state.settings.reportCurrency) {
    if (!this.state.budgets[month]) {
      this.state.budgets[month] = {
        overallUSD: 1100,
        savingsTargetUSD: 350,
        rolloverEnabled: false,
        categories: {
          cat_food: 180, cat_groceries: 150, cat_housing: 350, cat_utilities: 90,
          cat_transport: 75, cat_shopping: 100, cat_health: 50, cat_education: 55, cat_family: 50
        }
      };
    }
    const raw = this.state.budgets[month];
    const metrics = this.getPeriodMetrics(month, targetCurr);
    const prevMonth = this.getPreviousMonthStr(month);
    const prevRaw = this.state.budgets[prevMonth];
    const prevMetrics = prevRaw ? this.getPeriodMetrics(prevMonth, targetCurr) : null;

    const categoryRows = this.state.categories
      .filter(c => c.type === 'expense')
      .map(cat => {
        const baseUSD = Number(raw.categories?.[cat.id] || 0);
        const basePlanned = this.convertAmount(baseUSD, 'USD', targetCurr, this.state.settings.fxRateKHR);
        let rolloverAmt = 0;
        if (raw.rolloverEnabled && prevRaw && prevMetrics && prevMetrics.txCount > 0) {
          const prevPlanned = this.convertAmount(Number(prevRaw.categories?.[cat.id] || 0), 'USD', targetCurr, this.state.settings.fxRateKHR);
          const prevActual = Math.max(0, prevMetrics.byCategory[cat.id] || 0);
          rolloverAmt = prevPlanned - prevActual;
        }
        const effectivePlanned = Math.max(0, basePlanned + rolloverAmt);
        const actual = Math.max(0, metrics.byCategory[cat.id] || 0);
        const remaining = effectivePlanned - actual;
        const pct = effectivePlanned > 0 ? (actual / effectivePlanned) * 100 : (actual > 0 ? 100 : 0);
        return { category: cat, baseUSD, basePlanned, rolloverAmt, effectivePlanned, actual, remaining, pct };
      });

    const sumCatPlanned = categoryRows.reduce((s, r) => s + r.effectivePlanned, 0);
    const overallPlanned = Math.max(
      this.convertAmount(raw.overallUSD || 0, 'USD', targetCurr, this.state.settings.fxRateKHR),
      sumCatPlanned
    );
    const actualExpense = metrics.netExpense;
    const remainingBudget = overallPlanned - actualExpense;
    const usagePct = overallPlanned > 0 ? (actualExpense / overallPlanned) * 100 : 0;

    return {
      month, raw, overallPlanned, actualExpense, actualIncome: metrics.income,
      remainingBudget, usagePct, categoryRows
    };
  },

  getUpcomingBillsForMonth(month, targetCurr = this.state.settings.reportCurrency) {
    return (this.state.recurring || []).filter(r => r.active).map(r => {
      const dueDay = String(r.dayOfMonth || 1).padStart(2, '0');
      const dueDate = `${month}-${dueDay}`;
      const alreadyPosted = this.state.transactions.some(
        t => (t.recurringId === r.id && t.date.startsWith(month)) ||
             (t.date.startsWith(month) && t.description.toLowerCase() === r.description.toLowerCase() && Math.abs(t.amount - r.amount) < 0.01)
      );
      const todayStr = new Date().toISOString().slice(0, 10);
      return {
        ...r,
        dueDate,
        isPaid: alreadyPosted || r.lastGeneratedPeriod === month,
        isOverdue: !alreadyPosted && dueDate < todayStr && month <= todayStr.slice(0, 7),
        amountInReportCurr: this.convertAmount(r.amount, r.currency, targetCurr, this.state.settings.fxRateKHR)
      };
    }).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  },

  // ============================================================================
  // THEME, HEADER & NAVIGATION CONTROLLERS
  // ============================================================================
  applyTheme() {
    const mode = this.state.settings.theme || 'dark';
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = mode === 'dark' || (mode === 'system' && prefersDark);
    document.documentElement.classList.toggle('dark', isDark);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', isDark ? '#090d16' : '#f4f6fb');
    const dBtn = document.getElementById('desktop-theme-btn');
    if (dBtn) dBtn.innerHTML = Icon(isDark ? 'sun' : 'moon', 18);
  },

  cycleTheme(explicitMode = null) {
    if (explicitMode) {
      this.state.settings.theme = explicitMode;
    } else {
      this.state.settings.theme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    }
    this.applyTheme();
    this.saveState();
    this.render();
    this.toast(`Theme set to ${this.state.settings.theme}`, 'info');
  },

  updateHeaderBar() {
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const gEl = document.getElementById('header-greeting');
    if (gEl) gEl.textContent = greeting;

    const mLabel = document.getElementById('header-month-label');
    if (mLabel) mLabel.textContent = this.formatMonthDisplay(this.state.settings.selectedMonth);

    const cBtn = document.getElementById('header-curr-btn');
    if (cBtn) cBtn.textContent = this.state.settings.reportCurrency === 'USD' ? 'USD ($)' : 'KHR (៛)';

    const fxBadge = document.getElementById('sidebar-fx-badge');
    if (fxBadge) fxBadge.textContent = `1 USD = ${Number(this.state.settings.fxRateKHR).toLocaleString()} ៛`;

    const unpaidBills = this.getUpcomingBillsForMonth(this.state.settings.selectedMonth).filter(b => !b.isPaid && b.type === 'expense');
    const bellBadge = document.getElementById('header-bell-badge');
    if (bellBadge) {
      if (unpaidBills.length > 0) {
        bellBadge.textContent = unpaidBills.length;
        bellBadge.classList.remove('hidden');
      } else {
        bellBadge.classList.add('hidden');
      }

  },

  toggleReportCurrency() {
    this.state.settings.reportCurrency = this.state.settings.reportCurrency === 'USD' ? 'KHR' : 'USD';

        return `

  switchTab(tabId) {
    this.activeTab = tabId;

    if (titleEl && navObj) titleEl.textContent = navObj.id === 'home' ? 'MyMoney' : navObj.label;

    this.subView = sub;
    const titles = {
      accounts: 'Accounts & Net Worth',
      goals: 'Savings Goals',
      calendar: 'Bills & Recurring Calendar',
      import: 'Bank Statement Import Wizard'
    };
    const titleEl = document.getElementById('header-title');
    if (titleEl) titleEl.textContent = titles[sub] || 'MyMoney';
    this.renderNavigation();
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  destroyCharts() {
    Object.values(this.charts).forEach(ch => {
      if (ch && typeof ch.destroy === 'function') ch.destroy();
    });
    this.charts = {};
  },

  render() {
    this.destroyCharts();
    this.updateHeaderBar();
    const container = document.getElementById('app-view');
    if (!container) return;

    if (this.subView === 'accounts') return this.renderAccountsView(container);
    if (this.subView === 'goals') return this.renderGoalsView(container);
    if (this.subView === 'calendar') return this.renderCalendarView(container);
    if (this.subView === 'import') return this.renderImportWizardView(container);

    switch (this.activeTab) {
      case 'home': this.renderHomeDashboard(container); break;
      case 'transactions': this.renderTransactionsScreen(container); break;
      case 'budget': this.renderBudgetScreen(container); break;
      case 'reports': this.renderReportsScreen(container); break;
      case 'settings': this.renderSettingsScreen(container); break;
      default: this.renderHomeDashboard(container);
    }
  },

  initHomeCharts(month, curr, budget) {
    if (typeof Chart === 'undefined') return;
    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? '#94a3b8' : '#64748b';
    const gridColor = isDark ? 'rgba(148, 163, 184, 0.08)' : 'rgba(15, 23, 42, 0.06)';

    const catCanvas = document.getElementById('home-cat-chart');
    if (catCanvas && budget.actualExpense > 0) {
      const activeCats = budget.categoryRows.filter(r => r.actual > 0).sort((a, b) => b.actual - a.actual);
      this.charts.homeCat = new Chart(catCanvas, {
        type: 'doughnut',
        data: {
          labels: activeCats.map(r => r.category.name),
          datasets: [{
            data: activeCats.map(r => +r.actual.toFixed(2)),
            backgroundColor: activeCats.map(r => r.category.color),
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.label}: ${this.formatMoney(ctx.raw, curr)}`
              }
            }
          }
        }
      });
    }

    const trendCanvas = document.getElementById('home-trend-chart');
    if (trendCanvas) {
      const months = [];
      let ptr = month;
      for (let i = 0; i < 6; i++) {
        months.unshift(ptr);
        ptr = this.getPreviousMonthStr(ptr);
      }
      this.charts.homeTrend = new Chart(trendCanvas, {
        type: 'bar',
        data: {
          labels: months.map(m => this.formatMonthDisplay(m)),
          datasets: [
            { label: 'Income', data: months.map(m => +this.getPeriodMetrics(m, curr).income.toFixed(2)), backgroundColor: '#10b981', borderRadius: 6, maxBarThickness: 22 },
            { label: 'Expenses', data: months.map(m => +this.getPeriodMetrics(m, curr).netExpense.toFixed(2)), backgroundColor: '#6366f1', borderRadius: 6, maxBarThickness: 22 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } },
            y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } }
          },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { boxWidth: 10, usePointStyle: true, color: textColor, font: { size: 11 } } }
          }
        }
      });
    }

          </div>
          <h3 class="font-bold text-sm">No transactions recorded yet</h3>
          <p class="text-xs text-slate-400 max-w-xs mx-auto mt-1 mb-4">Add your first income, expense, or account transfer to start tracking your finances.</p>
          <button onclick="App.openTxSheet()" class="px-4 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold inline-flex items-center gap-1.5 shadow-sm btn-press">
            ${Icon('plus', 15)}
            <span>Add Transaction</span>
          </button>
        </div>
      `;
    }

    const groups = {};
    txs.forEach(tx => {
      if (!groups[tx.date]) groups[tx.date] = [];
      groups[tx.date].push(tx);
    });

    const todayStr = new Date().toISOString().slice(0, 10);
    const yestStr = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

    return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
      const dateLabel = date === todayStr ? 'Today' : date === yestStr ? 'Yesterday' : new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      return `
        <div class="mb-3 last:mb-0">
          <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 py-1.5 px-1">${dateLabel}</div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800/70">
            ${groups[date].map(tx => {
              const cat = this.state.categories.find(c => c.id === tx.categoryId) || { name: 'Transfer', iconName: 'repeat', color: '#6366f1' };
              const acc = this.state.accounts.find(a => a.id === tx.accountId);
              const toAcc = tx.toAccountId ? this.state.accounts.find(a => a.id === tx.toAccountId) : null;
              const isIncome = tx.type === 'income' || tx.type === 'refund';
              const isTransfer = tx.type === 'transfer';
              const amtClass = isIncome ? 'text-emerald-600 dark:text-emerald-400' : isTransfer ? 'text-slate-600 dark:text-slate-300' : 'text-slate-900 dark:text-white';
              const sign = isIncome ? '+' : isTransfer ? '⇄ ' : '-';

              return `
                <div onclick="App.openTxDetailSheet('${tx.id}')" class="py-3 px-1.5 -mx-1.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 flex items-center justify-between gap-3 cursor-pointer transition">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                         style="background-color: ${(isTransfer ? '#6366f1' : cat.color)}18; color: ${isTransfer ? '#6366f1' : cat.color}">
                      ${Icon(isTransfer ? 'repeat' : (cat.iconName || 'shoppingBag'), 18)}
                    </div>
                    <div class="min-w-0">
                      <div class="font-semibold text-xs sm:text-sm truncate flex items-center gap-1.5">
                        <span class="truncate">${tx.description}</span>
                        ${tx.splits && tx.splits.length ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-medium bg-brand-500/15 text-brand-400">Split</span>` : ''}
                        ${tx.type === 'refund' ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-medium bg-cyan-500/15 text-cyan-400">Refund</span>` : ''}
                      </div>
                      <div class="text-[11px] text-slate-400 truncate mt-0.5">
                        ${isTransfer ? `${acc?.name || 'Account'} → ${toAcc?.name || 'Account'}` : `${cat.name} • ${acc?.name || ''}`}
                      </div>
                    </div>
                  </div>
                  <div class="text-right shrink-0 tabular-nums">
                    <div class="font-bold text-xs sm:text-sm ${amtClass}">
                      ${sign}${this.formatMoney(tx.amount, tx.currency, true)}
                    </div>
                    ${tx.currency !== this.state.settings.reportCurrency ? `
                      <div class="text-[10px] text-slate-400">≈ ${this.formatMoney(this.txInReportCurrency(tx), this.state.settings.reportCurrency, true)}</div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  },

  openTxDetailSheet(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return;
    const cat = this.state.categories.find(c => c.id === tx.categoryId) || { name: 'Transfer', iconName: 'repeat', color: '#6366f1' };
    const acc = this.state.accounts.find(a => a.id === tx.accountId);
    const toAcc = tx.toAccountId ? this.state.accounts.find(a => a.id === tx.toAccountId) : null;

    this.openSheet(`
      <div class="p-5 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Transaction Details</span>
        <button onclick="App.closeSheet()" class="p-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-white">${Icon('close', 16)}</button>
      </div>
      <div class="p-5 space-y-4 overflow-y-auto text-sm">
        <div class="flex flex-col items-center text-center py-2">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-2" style="background-color:${cat.color}20; color:${cat.color}">
            ${Icon(tx.type === 'transfer' ? 'repeat' : (cat.iconName || 'wallet'), 24)}
          </div>
          <div class="text-2xl font-extrabold tabular-nums">
            ${tx.type === 'income' || tx.type === 'refund' ? '+' : tx.type === 'transfer' ? '⇄ ' : '-'}${this.formatMoney(tx.amount, tx.currency)}
          </div>
          <div class="font-semibold text-base mt-1">${tx.description}</div>
          <span class="text-xs text-slate-400 mt-0.5 capitalize">${tx.type} • ${tx.date}</span>
        </div>

        <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 space-y-2.5 text-xs">
          <div class="flex justify-between">
            <span class="text-slate-400">Account</span>
            <span class="font-semibold">${acc ? acc.name : '—'}${toAcc ? ' → ' + toAcc.name : ''}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Category</span>
            <span class="font-semibold">${tx.type === 'transfer' ? 'Internal Transfer' : cat.name}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Payment Method</span>
            <span class="font-semibold">${tx.paymentMethod || 'Standard'}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Locked Exchange Rate</span>
            <span class="font-semibold tabular-nums">1 USD = ${(tx.fxRateUsed || this.state.settings.fxRateKHR).toLocaleString()} KHR</span>
          </div>
          ${tx.notes ? `<div class="pt-2 border-t border-slate-200/60 dark:border-slate-700/60"><span class="text-slate-400 block mb-0.5">Notes</span><p class="font-medium">${tx.notes}</p></div>` : ''}
        </div>

        ${tx.splits && tx.splits.length ? `
          <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 space-y-1.5 text-xs">
            <div class="font-bold text-slate-400 uppercase text-[10px]">Split Breakdown</div>
            ${tx.splits.map(s => {
              const sc = this.state.categories.find(c => c.id === s.categoryId);
              return `<div class="flex justify-between"><span>${sc ? sc.name : 'Category'} ${s.note ? `(${s.note})` : ''}</span><span class="font-bold tabular-nums">${this.formatMoney(s.amount, tx.currency)}</span></div>`;
            }).join('')}
          </div>
        ` : ''}
      </div>
      <div class="p-4 border-t border-slate-200/80 dark:border-slate-800 grid grid-cols-3 gap-2">
        <button onclick="App.duplicateTx('${tx.id}')" class="py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold text-xs flex items-center justify-center gap-1.5 btn-press">
          ${Icon('copy', 14)} <span>Duplicate</span>
        </button>
        <button onclick="App.openTxSheet('${tx.id}')" class="py-2.5 px-3 rounded-xl bg-brand-600 text-white font-semibold text-xs flex items-center justify-center gap-1.5 btn-press">
          ${Icon('edit', 14)} <span>Edit</span>
        </button>
        <button onclick="App.confirmDeleteTx('${tx.id}')" class="py-2.5 px-3 rounded-xl bg-rose-500/15 text-rose-500 font-semibold text-xs flex items-center justify-center gap-1.5 btn-press">
          ${Icon('trash', 14)} <span>Delete</span>
        </button>
      </div>
    `);
  },

  duplicateTx(txId) {
    const orig = this.state.transactions.find(t => t.id === txId);
    if (!orig) return;
    const copy = {
      ...JSON.parse(JSON.stringify(orig)),
      id: 'tx_' + Date.now(),
      date: new Date().toISOString().slice(0, 10)
    };
    this.state.transactions.push(copy);
    this.saveState();
    this.closeSheet();
    this.render();
    this.toast('Transaction duplicated for today', 'success');
  },

  confirmDeleteTx(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return;
    this.openConfirmDialog({
      title: 'Delete Transaction?',
      message: `Are you sure you want to delete "${tx.description}" (${this.formatMoney(tx.amount, tx.currency)})? Account balances and monthly budgets will immediately recalculate.`,
      confirmLabel: 'Delete Permanently',
      danger: true,
      onConfirm: () => {
        this.state.transactions = this.state.transactions.filter(t => t.id !== txId);
        this.saveState();
        this.closeSubSheet();
        this.closeSheet();
        this.render();
        this.toast('Transaction deleted', 'info');
      }
    });
  },

  // ============================================================================
  // 8. TRANSACTIONS SCREEN
  // ============================================================================
  renderTransactionsScreen(el) {
    const f = this.txFilter;
    const curr = this.state.settings.reportCurrency;

    let list = this.state.transactions.filter(tx => {
      if (f.search) {
        const q = f.search.toLowerCase();
        const inDesc = (tx.description || '').toLowerCase().includes(q);
        const inNotes = (tx.notes || '').toLowerCase().includes(q);
        const inTags = (tx.tags || []).some(t => t.toLowerCase().includes(q));
        if (!inDesc && !inNotes && !inTags) return false;
      }
      if (f.accountId !== 'ALL' && tx.accountId !== f.accountId && tx.toAccountId !== f.accountId) return false;
      if (f.categoryId !== 'ALL') {
        const inSplit = tx.splits && tx.splits.some(s => s.categoryId === f.categoryId);
        if (tx.categoryId !== f.categoryId && !inSplit) return false;
      }
      if (f.type !== 'ALL' && tx.type !== f.type) return false;
      if (f.currency !== 'ALL' && tx.currency !== f.currency) return false;
      if (f.dateFrom && tx.date < f.dateFrom) return false;
      if (f.dateTo && tx.date > f.dateTo) return false;
      if (f.minAmt !== '' && tx.amount < Number(f.minAmt)) return false;
      if (f.maxAmt !== '' && tx.amount > Number(f.maxAmt)) return false;
      return true;
    });

    list.sort((a, b) => {
      if (f.sort === 'date_asc') return a.date.localeCompare(b.date);
      if (f.sort === 'amt_desc') return this.txInReportCurrency(b) - this.txInReportCurrency(a);
      if (f.sort === 'amt_asc') return this.txInReportCurrency(a) - this.txInReportCurrency(b);
      return b.date.localeCompare(a.date);
    });

    // Summary of filtered rows
    let sumIn = 0, sumOut = 0;
    list.forEach(t => {
      const v = this.txInReportCurrency(t, curr);
      if (t.type === 'income') sumIn += v;
      else if (t.type === 'expense') sumOut += v;
      else if (t.type === 'refund') sumOut = Math.max(0, sumOut - v);
    });

    const activeFilterChips = [];
    if (f.type !== 'ALL') activeFilterChips.push({ label: `Type: ${f.type}`, clear: () => { this.txFilter.type = 'ALL'; this.render(); } });
    if (f.accountId !== 'ALL') {
      const a = this.state.accounts.find(x => x.id === f.accountId);
      activeFilterChips.push({ label: `Account: ${a ? a.name : f.accountId}`, clear: () => { this.txFilter.accountId = 'ALL'; this.render(); } });
    }
    if (f.categoryId !== 'ALL') {
      const c = this.state.categories.find(x => x.id === f.categoryId);
      activeFilterChips.push({ label: `Category: ${c ? c.name : f.categoryId}`, clear: () => { this.txFilter.categoryId = 'ALL'; this.render(); } });
    }
    if (f.currency !== 'ALL') activeFilterChips.push({ label: `Currency: ${f.currency}`, clear: () => { this.txFilter.currency = 'ALL'; this.render(); } });
    if (f.dateFrom || f.dateTo) activeFilterChips.push({ label: `Dates: ${f.dateFrom || '*'} → ${f.dateTo || '*'}`, clear: () => { this.txFilter.dateFrom = ''; this.txFilter.dateTo = ''; this.render(); } });

    el.innerHTML = `
      <!-- Search & Filter Bar -->
      <div class="fin-card p-3.5 sm:p-4 space-y-3">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${Icon('search', 16)}</span>
            <input type="text" value="${f.search}" placeholder="Search merchant, notes, or #tags..."
              oninput="App.txFilter.search=this.value; App.renderTransactionsListOnly()"
              class="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/90 border border-transparent focus:border-brand-500 text-xs sm:text-sm focus:outline-none" />
          </div>
          <button onclick="App.openFilterSheet()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold flex items-center gap-1.5 shrink-0 btn-press">
            ${Icon('filter', 15)}
            <span>Filter & Sort</span>
            ${activeFilterChips.length ? `<span class="w-4 h-4 rounded-full bg-brand-600 text-white text-[10px] flex items-center justify-center">${activeFilterChips.length}</span>` : ''}
          </button>
          <button onclick="App.openTxSheet()" class="hidden sm:flex px-3.5 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold items-center gap-1.5 shrink-0 btn-press">
            ${Icon('plus', 15)}
            <span>Add</span>
          </button>
        </div>

        ${activeFilterChips.length ? `
          <div class="flex flex-wrap items-center gap-1.5 pt-1">
            ${activeFilterChips.map((chip, idx) => `
              <button onclick="App.clearSingleFilterChip(${idx})" class="px-2.5 py-1 rounded-lg bg-brand-500/15 text-brand-600 dark:text-brand-400 text-[11px] font-semibold flex items-center gap-1">
                <span>${chip.label}</span>
                <span>✕</span>
              </button>
            `).join('')}
            <button onclick="App.resetAllTxFilters()" class="text-[11px] text-slate-400 hover:text-rose-500 underline ml-1">Reset all</button>
          </div>
        ` : ''}
      </div>

      <!-- Period Summary Bar -->
      <div class="grid grid-cols-3 gap-2.5 sm:gap-4" id="tx-summary-strip">
        <div class="fin-card p-3 sm:p-4">
          <div class="text-[11px] text-slate-400">Filtered Income</div>
          <div class="text-sm sm:text-lg font-bold text-emerald-600 dark:text-emerald-400 tabular-nums mt-0.5">${this.formatMoney(sumIn, curr, true)}</div>
        </div>
        <div class="fin-card p-3 sm:p-4">
          <div class="text-[11px] text-slate-400">Filtered Expenses</div>
          <div class="text-sm sm:text-lg font-bold text-rose-500 tabular-nums mt-0.5">${this.formatMoney(sumOut, curr, true)}</div>
        </div>
        <div class="fin-card p-3 sm:p-4">
          <div class="text-[11px] text-slate-400">Net Flow (${list.length})</div>
          <div class="text-sm sm:text-lg font-bold tabular-nums mt-0.5 ${sumIn - sumOut >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">${this.formatMoney(sumIn - sumOut, curr, true)}</div>
        </div>
      </div>

      <!-- Transactions List Container -->
      <div class="fin-card p-4 sm:p-5" id="tx-list-container">
        ${this.renderGroupedTransactionList(list)}
      </div>
    `;
    this._activeFilterChips = activeFilterChips;
  },

  renderTransactionsListOnly() {
    const container = document.getElementById('tx-list-container');
    if (!container) return this.render();
    const f = this.txFilter;
    const list = this.state.transactions.filter(tx => {
      if (f.search) {
        const q = f.search.toLowerCase();
        const inDesc = (tx.description || '').toLowerCase().includes(q);
        const inNotes = (tx.notes || '').toLowerCase().includes(q);
        const inTags = (tx.tags || []).some(t => t.toLowerCase().includes(q));
        if (!inDesc && !inNotes && !inTags) return false;
      }
      if (f.accountId !== 'ALL' && tx.accountId !== f.accountId && tx.toAccountId !== f.accountId) return false;
      if (f.categoryId !== 'ALL' && tx.categoryId !== f.categoryId) return false;
      if (f.type !== 'ALL' && tx.type !== f.type) return false;
      if (f.currency !== 'ALL' && tx.currency !== f.currency) return false;
      return true;
    }).sort((a, b) => b.date.localeCompare(a.date));
    container.innerHTML = this.renderGroupedTransactionList(list);
  },

  clearSingleFilterChip(idx) {
    if (this._activeFilterChips && this._activeFilterChips[idx]) {
      this._activeFilterChips[idx].clear();
    }
  },

  resetAllTxFilters() {
    this.txFilter = { search: '', accountId: 'ALL', categoryId: 'ALL', type: 'ALL', currency: 'ALL', minAmt: '', maxAmt: '', dateFrom: '', dateTo: '', sort: 'date_desc' };
    this.render();
  },

  drilldownToTransactions(filters) {
    this.txFilter = { search: '', accountId: 'ALL', categoryId: 'ALL', type: 'ALL', currency: 'ALL', minAmt: '', maxAmt: '', dateFrom: '', dateTo: '', sort: 'date_desc', ...filters };
    this.switchTab('transactions');
  },

    this.openSheet(`
      <div class="p-5 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">

              <option value="date_asc" ${f.sort === 'date_asc' ? 'selected' : ''}>Oldest First</option>
              <option value="amt_desc" ${f.sort === 'amt_desc' ? 'selected' : ''}>Highest Amount</option>

              <option value="ALL">All Accounts</option>
              ${this.state.accounts.map(a => `<option value="${a.id}" ${f.accountId === a.id ? 'selected' : ''}>${a.name} (${a.currency})</option>`).join('')}
            </select>
          </div>

            <label class="block text-xs text-slate-400 mb-1">Category</label>
            <select id="flt-cat" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <option value="ALL">All Categories</option>
              ${this.state.categories.map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Currency</label>
            <select id="flt-curr" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <option value="ALL" ${f.currency === 'ALL' ? 'selected' : ''}>All (USD & KHR)</option>
              <option value="USD" ${f.currency === 'USD' ? 'selected' : ''}>USD Only</option>
              <option value="KHR" ${f.currency === 'KHR' ? 'selected' : ''}>KHR Only</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Min Amount</label>
            <input id="flt-min" type="number" step="any" value="${f.minAmt}" placeholder="0" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          </div>

            <label class="block text-xs text-slate-400 mb-1">Max Amount</label>
            <input id="flt-max" type="number" step="any" value="${f.maxAmt}" placeholder="Any" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          </div>

            <label class="block text-xs text-slate-400 mb-1">From Date</label>
            <input id="flt-from" type="date" value="${f.dateFrom}" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          </div>

            <label class="block text-xs text-slate-400 mb-1">To Date</label>
            <input id="flt-to" type="date" value="${f.dateTo}" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between gap-2">

        <button onclick="App.applyFilterSheet()" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white font-semibold text-xs btn-press">Apply Filters</button>
      </div>
    `);
  },

  applyFilterSheet() {
    this.txFilter.type = document.getElementById('flt-type').value;
    this.txFilter.sort = document.getElementById('flt-sort').value;

  renderAnnualBudgetComparison(el, year, curr) {
    const months = [];
    let totalPlanned = 0, totalActual = 0, totalIncome = 0;
    for (let m = 1; m <= 12; m++) {
      const ym = `${year}-${String(m).padStart(2, '0')}`;
      const hasActivity = this.state.budgets[ym] || this.state.transactions.some(t => t.date.startsWith(ym));
      const b = this.getBudgetForMonth(ym, curr);
      if (hasActivity) {
        totalPlanned += b.overallPlanned;
        totalActual += b.actualExpense;
        totalIncome += b.actualIncome;
      }
      months.push({ ym, hasActivity, ...b });
    }

    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="inline-flex p-1 rounded-xl bg-slate-200/70 dark:bg-slate-800/80 text-xs font-semibold">
          <button onclick="App.budgetViewMode='monthly'; App.render()" class="px-3.5 py-1.5 rounded-lg text-slate-500">Monthly Planner</button>
          <button onclick="App.budgetViewMode='annual'; App.render()" class="px-3.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 shadow-2xs text-brand-600 dark:text-brand-400">Annual Overview (${year})</button>

      </div>

          <div class="text-xl font-bold tabular-nums mt-1">${this.formatMoney(totalPlanned, curr, true)}</div>

        <div class="fin-card p-4">
          <div class="text-xs text-slate-400">${year} Actual Eligible Spending</div>
          <div class="text-xl font-bold text-rose-500 tabular-nums mt-1">${this.formatMoney(totalActual, curr, true)}</div>
        </div>
        <div class="fin-card p-4">
          <div class="text-xs text-slate-400">${year} Net Budget Variance</div>
          <div class="text-xl font-bold tabular-nums mt-1 ${totalPlanned - totalActual >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${this.formatMoney(totalPlanned - totalActual, curr, true)}</div>
        </div>
      </div>

      <div class="fin-card p-4 sm:p-5 space-y-2.5">
        <h3 class="font-bold text-sm mb-2">Month-by-Month Comparison (${year})</h3>${months.map(m => `
          <div onclick="App.state.settings.selectedMonth='${m.ym}'; App.budgetViewMode='monthly'; App.saveState(); App.render();"

                <div class="h-full rounded-full ${m.usagePct > 100 ? 'bg-rose-500' : 'bg-brand-600'}" style="width:${m.hasActivity ? Math.min(100, m.usagePct) : 0}%"></div>
              </div>
            </div>
            <div class="text-right tabular-nums w-40">
              <span class="font-bold">${this.formatMoney(m.actualExpense, curr, true)}</span>
              <span class="text-slate-400 text-[11px]"> / ${this.formatMoney(m.overallPlanned, curr, true)}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  },

  openCategoryDetailSheet(catId) {
    const month = this.state.settings.selectedMonth;
    const curr = this.state.settings.reportCurrency;
    const b = this.getBudgetForMonth(month, curr);
    const row = b.categoryRows.find(r => r.category.id === catId);
    const cat = this.state.categories.find(c => c.id === catId);
    if (!cat) return;

    const catTxs = this.state.transactions.filter(t => {
      if (!t.date.startsWith(month) || t.type === 'transfer') return false;
      if (t.splits && t.splits.some(s => s.categoryId === catId)) return true;
      return t.categoryId === catId;
    }).sort((a, b) => b.date.localeCompare(a.date));

    this.openSheet(`
      <div class="p-5 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background-color:${cat.color}20; color:${cat.color}">
            ${Icon(cat.iconName || 'shoppingBag', 18)}
          </div>
          <div>
            <h3 class="font-bold text-sm sm:text-base">${cat.name}</h3>
            <span class="text-[11px] text-slate-400">${this.formatMonthDisplay(month)} Activity</span>
          </div>

              <span class="text-slate-400">Spent this month</span>
              <span class="font-bold text-sm tabular-nums">${this.formatMoney(row.actual, curr)} / ${this.formatMoney(row.effectivePlanned, curr)}</span>
            </div>
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 text-xs">

              <div class="flex items-center gap-1.5">

                  class="w-24 p-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-right font-bold tabular-nums" />
                <button onclick="App.saveSingleCategoryBudget('${month}', '${cat.id}')" class="px-3 py-1.5 rounded-lg bg-brand-600 text-white font-semibold">Save</button>
              </div>
            </div>
          </div>

        <div>

    `);

  saveSingleCategoryBudget(month, catId) {

    this.state.budgets[month].categories[catId] = val;

  saveMasterBudgetSheet(month) {
    this.getBudgetForMonth(month);
    this.state.budgets[month].overallUSD = Math.max(0, Number(document.getElementById('mb-overall').value) || 0);
    this.state.budgets[month].savingsTargetUSD = Math.max(0, Number(document.getElementById('mb-savings').value) || 0);
    document.querySelectorAll('[data-cat-budget]').forEach(inp => {
      const cid = inp.getAttribute('data-cat-budget');
      this.state.budgets[month].categories[cid] = Math.max(0, Number(inp.value) || 0);
    });
    this.saveState();
    this.closeSheet();
    this.render();
    this.toast(`Budget plan saved for ${this.formatMonthDisplay(month)}`, 'success');

  toggleRollover(month, enabled) {
    this.getBudgetForMonth(month);
    this.state.budgets[month].rolloverEnabled = !!enabled;
    this.saveState();
    this.render();
    this.toast(`Budget rollover ${enabled ? 'enabled' : 'disabled'}`, 'info');
  },

  copyPrevMonthBudget(month) {
    const prev = this.getPreviousMonthStr(month);
    if (!this.state.budgets[prev]) return this.toast(`No budget configured in ${this.formatMonthDisplay(prev)}`, 'warning');
    this.state.budgets[month] = JSON.parse(JSON.stringify(this.state.budgets[prev]));
    this.saveState();
    this.render();
    this.toast(`Copied budget plan from ${this.formatMonthDisplay(prev)}`, 'success');
  },

  // ============================================================================
  renderReportsScreen(el) {
    const curr = this.state.settings.reportCurrency;
    const month = this.state.settings.selectedMonth;
    const countMap = { '1m': 1, '3m': 3, '6m': 6, '1y': 12 };
    const numMonths = countMap[this.reportRange] || 6;

    const months = [];
    let ptr = month;
    for (let i = 0; i < numMonths; i++) {
      months.unshift(ptr);
      ptr = this.getPreviousMonthStr(ptr);
    }

    let totalInc = 0, totalExp = 0;
    const catTotals = {};
    months.forEach(m => {
      const met = this.getPeriodMetrics(m, curr);
      totalInc += met.income;
      totalExp += met.netExpense;
      Object.entries(met.byCategory).forEach(([cid, val]) => {
        catTotals[cid] = (catTotals[cid] || 0) + val;
      });
    });

    const netSavings = totalInc - totalExp;
    const savingsRate = totalInc > 0 ? ((netSavings / totalInc) * 100).toFixed(1) : '0.0';
    const balSummary = this.getConsolidatedBalanceSummary(curr);

    const expCatRows = this.state.categories
      .filter(c => c.type === 'expense')
      .map(c => ({ cat: c, amount: Math.max(0, catTotals[c.id] || 0) }))
      .filter(r => r.amount > 0)
      .sort((a, b) => b.amount - a.amount);

            ${Icon('download', 14)} <span>Excel</span>
          </button>
        </div>
      </div>

      <!-- Executive KPI Strip -->

        <div class="fin-card p-4">
          <div class="text-xs text-slate-400">Period Income</div>
          <div class="text-lg sm:text-xl font-bold text-emerald-600 dark:text-emerald-400 tabular-nums mt-1">${this.formatMoney(totalInc, curr, true)}</div>
        </div>
        <div class="fin-card p-4">
          <div class="text-xs text-slate-400">Net Expenses</div>
          <div class="text-lg sm:text-xl font-bold text-rose-500 tabular-nums mt-1">${this.formatMoney(totalExp, curr, true)}</div>
        </div>

          <div class="text-xs text-slate-400">Net Cash Flow (${savingsRate}%)</div>

        </div>

          <div class="text-xs text-slate-400">Current Net Worth</div>

            ${expCatRows.map(r => {

              return `
                <div onclick="App.drilldownToTransactions({categoryId:'${r.cat.id}'})" class="p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition space-y-1.5">

                      <span class="font-bold">${this.formatMoney(r.amount, curr, true)}</span>

                    </div>
                  </div>
                  <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">

            }).join('')}
          </div>
        ` : `<p class="text-xs text-slate-400 py-8 text-center">No expenses recorded in this date range.</p>`}
      </div>
    `;

    this.initReportCharts(months, curr);
  },

  initReportCharts(months, curr) {
    if (typeof Chart === 'undefined') return;
    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? '#94a3b8' : '#64748b';
    const gridColor = isDark ? 'rgba(148, 163, 184, 0.08)' : 'rgba(15, 23, 42, 0.06)';

    const c1 = document.getElementById('rep-inc-exp-chart');
    if (c1) {
      this.charts.rep1 = new Chart(c1, {
        type: 'bar',
        data: {
          labels: months.map(m => this.formatMonthDisplay(m)),
          datasets: [
            { label: 'Income', data: months.map(m => +this.getPeriodMetrics(m, curr).income.toFixed(2)), backgroundColor: '#10b981', borderRadius: 6 },
            { label: 'Net Expenses', data: months.map(m => +this.getPeriodMetrics(m, curr).netExpense.toFixed(2)), backgroundColor: '#f43f5e', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } }, y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } } },
          plugins: { legend: { labels: { color: textColor, font: { size: 11 } } } }
        }
      });
    }

    const c2 = document.getElementById('rep-budget-var-chart');
    if (c2) {
      this.charts.rep2 = new Chart(c2, {
        type: 'line',
        data: {
          labels: months.map(m => this.formatMonthDisplay(m)),
          datasets: [
            { label: 'Actual Spend', data: months.map(m => +this.getBudgetForMonth(m, curr).actualExpense.toFixed(2)), borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.12)', fill: true, tension: 0.3 },
            { label: 'Planned Budget', data: months.map(m => +this.getBudgetForMonth(m, curr).overallPlanned.toFixed(2)), borderColor: '#94a3b8', borderDash: [5, 5], fill: false, tension: 0 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } }, y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } } },
          plugins: { legend: { labels: { color: textColor, font: { size: 11 } } } }
        }
      });
    }
  },

  openAccountDetailSheet(accId) {
    const acc = this.state.accounts.find(a => a.id === accId);
    if (!acc) return;
    const bal = this.getAccountBalance(acc.id);
    const accTxs = this.state.transactions.filter(t => t.accountId === acc.id || t.toAccountId === acc.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);

    this.openSheet(`
      <div class="p-5 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">

          <h3 class="font-bold text-base">${acc.name}</h3>

          </div>
        </div>
        <div>
          <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Recent Account Activity</div>
          ${this.renderGroupedTransactionList(accTxs)}
        </div>

    `);
  },

  openReconcileSubSheet(accId) {
    const acc = this.state.accounts.find(a => a.id === accId);
    if (!acc) return;
    const currentBal = this.getAccountBalance(acc.id);
    this.openSubSheet(`
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-base">Reconcile ${acc.name}</h3>
        <button onclick="App.closeSubSheet()" class="p-1 text-slate-400">${Icon('close', 16)}</button>
      </div>
      <div class="p-5 space-y-3 text-xs sm:text-sm">
        <p class="text-slate-400">Recorded balance is <strong class="text-slate-900 dark:text-white tabular-nums">${this.formatMoney(currentBal, acc.currency)}</strong>. Enter your actual statement or wallet balance below:</p>
        <input id="reconcile-new-bal" type="number" step="any" inputmode="decimal" value="${currentBal}"
          class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-lg tabular-nums border border-slate-300 dark:border-slate-700" />
      </div>
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
        <button onclick="App.closeSubSheet()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold">Cancel</button>
        <button onclick="App.applyReconciliation('${acc.id}')" class="px-5 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold btn-press">Save Adjustment</button>
      </div>
    `);
  },

  applyReconciliation(accId) {
    const acc = this.state.accounts.find(a => a.id === accId);
    const currentBal = this.getAccountBalance(accId);
    const actualBal = Number(document.getElementById('reconcile-new-bal').value);
    const diff = +(actualBal - currentBal).toFixed(2);
    if (Math.abs(diff) < 0.001) {
      this.closeSubSheet();
      return this.toast('Balance already matches', 'info');
    }
    this.state.transactions.push({
      id: 'tx_rec_' + Date.now(),
      date: new Date().toISOString().slice(0, 10),
      type: diff > 0 ? 'income' : 'expense',
      description: `Balance Reconciliation (${acc.name})`,
      amount: Math.abs(diff),
      currency: acc.currency,
      fxRateUsed: this.state.settings.fxRateKHR,
      accountId: acc.id,
      categoryId: 'cat_adjust',
      paymentMethod: 'Reconciliation',
      tags: ['reconcile'],
      notes: `Adjusted from ${currentBal} to${actualBal}`
    });
    this.saveState();
    this.closeSubSheet();
    this.closeSheet();
    this.render();
    this.toast('Account balance reconciled', 'success');
  },

  confirmDeleteAccount(accId) {
    if (this.state.accounts.length <= 1) return this.toast('Keep at least one active account', 'warning');
    const acc = this.state.accounts.find(a => a.id === accId);
    this.openConfirmDialog({
      title: `Remove "${acc?.name}"?`,
      message: 'Removing this account will hide it from your account selector. Existing transactions linked to this account will remain in your history.',
      confirmLabel: 'Remove Account',
      danger: true,
      onConfirm: () => {
        this.state.accounts = this.state.accounts.filter(a => a.id !== accId);
        this.saveState();
        this.closeSubSheet();
        this.closeSheet();
        this.render();
        this.toast('Account removed', 'info');
      }
    });
  },

  saveNewAccountForm() {
    const name = document.getElementById('new-acc-name').value.trim();
    const type = document.getElementById('new-acc-type').value;
    const currency = document.getElementById('new-acc-curr').value;
    const openingBalance = Number(document.getElementById('new-acc-open').value) || 0;
    if (!name) return this.toast('Please enter an account name', 'warning');
    this.state.accounts.push({
      id: 'acc_' + Date.now(), name, type, currency, openingBalance, isLiability: type === 'credit' || type === 'loan'

    this.saveState();
    this.closeSheet();
    this.render();
    this.toast(`Account "${name}" created`, 'success');
